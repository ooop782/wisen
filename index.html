/* ==================== 16. 背景動態星塵粒子 ==================== */
(function initStars(){
  const c = $('#starfield'); if(!c) return;
  const ctx = c.getContext('2d');
  let w, h, stars = [];
  function resize(){
    w = c.width = window.innerWidth; h = c.height = window.innerHeight;
    stars = Array.from({length: 65}, ()=>({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4 + 0.3,
      vx: (Math.random()-0.5)*0.12, vy: -Math.random()*0.18 - 0.04, a: Math.random()*0.7 + 0.2
    }));
  }
  resize(); window.addEventListener('resize', resize);
  function loop(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.x += s.vx; s.y += s.vy;
      if(s.y < 0) s.y = h; if(s.x < 0) s.x = w; if(s.x > w) s.x = 0;
      ctx.fillStyle = `rgba(242,214,139,${s.a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ==================== v5.2.1 存檔系統修復 ==================== */
const SAVE_VER=2;
function packS(){
 const evId=S.ev&&S.ev.id||null;
 return JSON.stringify(Object.assign({},S,{
  _v:SAVE_VER,queue:(S.queue||[]).map(e=>e&&e.id).filter(Boolean),ev:evId,
  pend:S.pending?(evId?'ev':(String(S.pending.title||'').indexOf('我思印刻')>=0?'imprint':'drop')):null,
  pending:null,block:null,blockIdx:S.block?S.log.indexOf(S.block):-1}));
}
function unpackS(str){
 const d=JSON.parse(str); if(!d||!d.name||!Array.isArray(d.log)) throw new Error('bad save');
 d.queue=(d.queue||[]).map(id=>EV[id]).filter(Boolean);
 const evId=d.ev; d.ev=evId&&EV[evId]?EV[evId]:null;
 d.block=d.blockIdx>=0?(d.log[d.blockIdx]||null):null; delete d.blockIdx;
 const pend=d.pend; delete d.pend; d.pending=null;
 const fix=it=>{if(it&&it.id&&ITEMS_DB[it.id]&&ITEMS_DB[it.id].use)it.use=ITEMS_DB[it.id].use};
 (d.inventory||[]).forEach(fix); if(d.equip){fix(d.equip.weapon);fix(d.equip.relic)}
 S=d;
 if(pend==='ev'&&d.ev&&d.ev.ask){for(let i=0;i<10&&!d.pending;i++){try{d.pending=d.ev.ask()||null}catch(e){d.pending=null}}}
 else if(pend==='imprint'){d.pending=imprintAsk();d.ev={}}
 if(!d.pending&&!d.block) newBlock();
 return d;
}
const metaOf=()=>({savedAt:new Date().toLocaleString('zh-TW'),name:S.name,age:S.age,year:S.year,region:regLabel(S),ver:SAVE_VER,data:packS()});
saveToSlot=function(idx){
 if(!S||!S.started) return;
 try{const slots=getSlots();slots[idx]=metaOf();localStorage.setItem(SAVE_SLOTS_KEY,JSON.stringify(slots));
  SFX.good();toast('存檔成功',`已保存至存檔槽 ${idx+1}`);savesModal();
 }catch(e){toast('存檔失敗','儲存空間不足或被禁用，請使用「匯出存檔」備份。')}
};
loadFromSlot=function(idx){
 const slots=getSlots();if(!slots[idx])return;
 try{unpackS(slots[idx].data);SFX.orb();
  $('#modal').hidden=true;$('#home-screen').hidden=true;$('#start').hidden=true;$('#tl').hidden=false;$('#game').hidden=false;
  render();toast('讀取存檔',`歡迎回來，${S.name}`);
 }catch(e){S=null;renderHome();toast('讀檔失敗','存檔資料損毀')}
};
autoSave=function(){
 if(!S||!S.started)return;
 try{const old=localStorage.getItem(AUTO_SAVE_KEY);if(old)localStorage.setItem(AUTO_SAVE_KEY+'-bak',old);
  localStorage.setItem(AUTO_SAVE_KEY,JSON.stringify(metaOf()));}catch(e){}
};
loadAutoSave=function(){
 for(const k of [AUTO_SAVE_KEY,AUTO_SAVE_KEY+'-bak']){
  try{const raw=JSON.parse(localStorage.getItem(k)||'null');if(!raw)continue;
   unpackS(raw.data);SFX.orb();
   $('#home-screen').hidden=true;$('#start').hidden=true;$('#tl').hidden=false;$('#game').hidden=false;
   render();toast('繼續輪迴',`已讀取自動存檔（${S.age} 歲）`);return true;
  }catch(e){}
 }
 S=null;return false;
};

/* ---------- 1. 位階（執照）體系 ---------- */
// 0 凡人/業餘、1 銅、2 鐵、3 銀、4 金、5 七彩。依執照與實力（魔力/劍術）取最高。
function tierOf(){
  if(!S || !S.lic) return 0;
  const pw = Math.max(S.magic||0, S.sword||0);
  const byPow = pw>=82?4 : pw>=60?3 : pw>=38?2 : pw>=18?1 : 0;
  return clamp(Math.max(S.lic.mage||0, S.lic.sword||0, byPow), 0, 5);
}
const TIER_N = ['凡人','銅階','鐵階','銀階','金階','七彩'];
function tierTitle(){
  const t = tierOf(); if(t===0) return S.awakened?'見習契約者':'普通人';
  const mageSide = (S.lic.mage>=S.lic.sword && (S.magic>=S.sword || S.lic.mage>0));
  return TIER_N[t] + (mageSide?'魔法師':'劍士');
}
const fmtT = s => String(s).replace(/\{T\}/g, tierTitle()).replace(/\{N\}/g, S?S.name:'');
function rv(d){
  const o = {}; if(!d) return o;
  for(const k in d){ const v=d[k]; o[k] = Array.isArray(v)?R.i(v[0],v[1]) : typeof v==='function'?v():v; }
  return o;
}
// 依敵人等級（0~5）產生數值：0 = 尋常野獸盜匪，5 = 彼岸魔將軍級
function foeStats(L){
  const m = DIFFICULTIES[S.diff||0].enemyMult;
  return { maxHp: Math.round((38 + L*32) * m), atk: Math.round((7 + L*4.6) * m) };
}

/* ---------- 2. 事件工具：TV（依位階分流）與通用選項 ---------- */
const EVCG = {
  x_wolf:'cg_road', x_festival:'cg_village', x_plague:'cg_village', x_treasure:'cg_road', x_duel:'cg_village',
  x_lost_child:'cg_village', x_storm:'cg_road', x_library:'cg_tower', x_beggar:'cg_village', x_rival:'cg_village',
  x_caravan_job:'cg_road', x_ghost:'cg_road', x_noble_invite:'cg_forest', x_orphans:'cg_village', x_mountain:'cg_snow',
  x_tax:'cg_village', x_love_letter:'cg_village', x_dragon_egg:'cg_dragon', x_mage_duel:'cg_tower', x_harvest_bad:'cg_village',
  x_pilgrim:'cg_tree', x_theft:'cg_village', x_comet:'cg_orbs', x_apprentice:'cg_tower', x_secret_society:'cg_evil',
  x_flood:'cg_village', x_gamble:'cg_village', x_old_master:'cg_road', x_mirror:'cg_evil', x_stranger:'cg_road',
  m_16:'cg_village', m_40:'cg_village', m_60:'cg_village', m_80:'cg_village', a_robber:'cg_road', c_stranger_return:'cg_village'
};
function mkCh(c){
  if(!Array.isArray(c)) return c;
  return { t:fmtT(c[0]), sub:c[1]?fmtT(c[1]):'', ok:c[7], bad:c[8], run(){
    S.xEv=(S.xEv||0)+1;
    const p = typeof c[2]==='function'?c[2]():c[2];
    if(R.c(p)) say(fmtT(c[3]), rv(c[4]));
    else say(fmtT(c[5]||'這一次，什麼特別的事也沒有發生。'), rv(c[6]), '死於意外');
  }};
}
// vars: [[最低位階, 標題, 文字, 選項陣列], ...]，取 位階 >= 最低位階 的最後一項
function TV(id,lo,hi,w,cg,vars,when,extra){
  def(id, Object.assign({ w, age:[lo,hi], when, ask(){
    const t = tierOf(); let v = vars[0];
    for(const x of vars) if(t>=x[0]) v=x;
    const ch = (typeof v[3]==='function'?v[3]():v[3]).map(mkCh);
    return { title:fmtT(v[1]), cg:cg||REG[S.region].cg, text:fmtT(v[2]), choices:ch };
  }}, extra||{}));
}
function combatCh(t, sub, foe, win, lose, extra){
  return { t, sub, run(){
    const st = foeStats(foe.L);
    startCombat(Object.assign({ name:foe.n, maxHp:st.maxHp, atk:st.atk, isEvil:!!foe.evil,
      onWin(){ say(fmtT(win[0]), rv(win[1])); if(win[2]) win[2](); },
      onLose(){ say(fmtT(lose[0]), rv(lose[1]), lose[2]||'戰死'); }
    }, extra||{}));
  }};
}


X = function(id,lo,hi,w,title,text,ch,when){
  def(id,{w:w,age:[lo,hi],when:when,ask(){return{title:fmtT(title),cg:EVCG[id]||REG[S.region].cg,text:fmtT(text),choices:ch.map(mkCh)}}});
};

def('orbOffer',{w:0,ask(){
  if(!S.orbOpts) return null;
  const opts=S.orbOpts.list.map(x=>({o:ORBS.find(o=>o.k===x.k),sub:x.sub})).filter(x=>x.o);
  const ch=opts.map(x=>({t:`與「${x.sub?x.o.n+'・'+x.sub:x.o.n}」夢境光球簽約`,sub:x.o.d,run(){S.orbOpts=null;signOrb(x.o,x.sub)}}));
  if(S.orbOpts.fallen) ch.push({t:'伸手觸碰那顆黯淡龜裂的光球',sub:'墮落光球：侵蝕 +10，獲得黑暗力量',bad:true,run(){S.orbOpts=null;signFallen()}});
  ch.push({t:'不簽約，繼續等待',run(){S.orbOpts=null;say('你讓光點從指尖飄走。')}});
  return{title:'夢境光球',cg:'cg_orbs',text:'黑暗中，元素光點朝你聚攏。你的我思容量決定了你能承載多少契約，牌組也將隨選擇而進化。',choices:ch};
}});
offerOrb=function(){
  const have=new Set(orbs().map(o=>o.key));
  const pool=ORBS.filter(o=>!have.has(o.k)); const src=pool.length?pool:ORBS.slice(); const list=[];
  const n=Math.min(src.length, R.c(.5)?3:2);
  for(let i=0;i<n;i++){ const o=src.splice(R.i(0,src.length-1),1)[0]; list.push({k:o.k,sub:R.c(.28)?R.p(o.sub):null}); }
  S.orbOpts={list,fallen:(S.corr>0||R.c(.14))};
  follow(EV.orbOffer);
};

exam=function(kind){
  const lv=S.lic[kind],nm=kind==='mage'?'魔法師':'劍士';
  if(lv===4 && S.fame<40){ say(`七彩${nm}的評審需要足以名留青史的實績，評審團認為你的聲望（${Math.round(S.fame)}）尚不足以擔此稱號。`); return; }
  const pw = kind==='mage'?S.magic:S.sword, need=THR[lv]||0;
  const p=clamp(.5+(pw-need)/50+(kind==='mage'?S.int:S.str)*.01+S.luck*.006-lv*.06,.12,.93);
  if(R.c(p)){
    S.lic[kind]=lv+1; SFX.good(); flashScreen('rgba(242,214,139,0.45)');
    say(`你通過協會的${nm}測驗，獲頒${LIC[lv+1]}執照。全世界持有${LIC[lv+1]}${nm}執照的約有${LICN[lv+1]}人。`,{fame:3+lv*3,money:8*(lv+1)});
    if(lv+1>=3) say(`從此，尋常的盜匪與野獸再也不是你的對手；人們開始以「${tierTitle()}」稱呼你。`);
  }else say(`${nm}晉級測驗沒有通過，評審建議你再磨練一年。`);
};

const _bpd = buildPlayerDeck;
buildPlayerDeck = function(){
  const ids = _bpd().map(c=>c.id);
  for(const e of evilC()){ if(e.key==='fear') ids.push('fear_drain'); if(e.key==='glut') ids.push('glut_devour'); if(e.key==='blind') ids.push('blind_zeal'); }
  if(tierOf()>=3) ids.push('assoc_art');
  for(const id of (S.deckExtra||[])) if(CARDS_DB[id]) ids.push(id);
  for(const id of (S.deckRemoved||[])){ const i=ids.indexOf(id); if(i>=0) ids.splice(i,1); }
  return ids.map((id,idx)=>{ const c=Object.assign({},CARDS_DB[id],{uid:idx+'_'+Math.random()});
    if(S.deckUp&&S.deckUp[id]){ c.up=true; c.n+='＋'; c.d+='（強化：效果 ×1.4）'; } return c; });
};
// 強化牌：傷害、護甲與治療 ×1.4
let UPGM = 1;
const _dd = dealDmg;
dealDmg = function(c, raw){ _dd(c, Math.round(raw*UPGM)); };
const _pc = playCombatCard;
playCombatCard = function(uid){
  const c=COMBAT; if(!c) return;
  const card=c.hand.find(x=>x.uid===uid); if(!card||c.cogito<card.cost) return;
  if(!card.up) return _pc(uid);
  const b0=c.pBlock, h0=S.health; UPGM=1.4;
  try{ _pc(uid); } finally { UPGM=1; }
  if(COMBAT===c){
    const db=c.pBlock-b0, dh=S.health-h0;
    if(db>0) c.pBlock+=Math.round(db*.4);
    if(dh>0) S.health=Math.min(maxH(),S.health+Math.round(dh*.4));
    renderCombat();
  }
};
const _ect = endCombatTurn;
endCombatTurn = function(){
  const c=COMBAT; if(!c) return;
  if(c.eStun){ c.eStun=false; c.intent={type:'stunned',val:0,label:'❄️ 被凍結，無法行動'}; c.logs.unshift(`${c.name}被寒霜凍結，這回合無法行動！`); }
  const keep=c.keepBlock?c.pBlock:null; c.keepBlock=false;
  _ect();
  if(COMBAT===c && keep!=null){ c.pBlock=Math.max(c.pBlock,keep); renderCombat(); }
};
const _sc = startCombat;
startCombat = function(cfg){
  const t=tierOf();
  const ow=cfg.onWin;
  cfg.onWin=function(){ if(ow) ow(); if(S.alive && !cfg.noReward){ S.rewardSrc='戰鬥'; follow(EV.cardReward); } };
  _sc(cfg);
  if(COMBAT){
    const ex=Math.floor(t/2);
    COMBAT.maxCogito+=ex; COMBAT.cogito+=ex; COMBAT.pBlock+=t*2;
    COMBAT.logs.unshift(`你以${tierTitle()}的實力應戰（我思上限 +${ex}，起始護甲 +${t*2}）。`);
    renderCombat();
  }
};
// 戰後/修行領悟：選卡、強化、移除
function rollRewardOpts(){
  const deck=buildPlayerDeck().map(c=>c.id);
  const cnt={}; deck.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  const pool=Object.values(CARDS_DB).filter(c=>c.req&&c.req()&&(cnt[c.id]||0)<3);
  const n=Math.min(pool.length, 3+(S.wis>=14?1:0)+(tierOf()>=3?1:0));
  const picks=[];
  for(let i=0;i<n;i++){ const c=pickW(pool,x=>x.w||1); pool.splice(pool.indexOf(c),1); picks.push(c.id); }
  const upC=[...new Set(deck)].filter(id=>!(S.deckUp&&S.deckUp[id]));
  const ups=[]; for(let i=0;i<2&&upC.length;i++) ups.push(upC.splice(R.i(0,upC.length-1),1)[0]);
  S.rewardOpts={picks,ups};
}
def('cardReward',{w:0,ask(){
  if(!S.rewardOpts) rollRewardOpts();
  const o=S.rewardOpts, deck=buildPlayerDeck().map(c=>c.id);
  const done=()=>{ S.rewardOpts=null; };
  const ch=o.picks.map(id=>({t:`習得【${CARDS_DB[id].n}】（${CARDS_DB[id].cost} 我思・${CARDS_DB[id].type}）`,sub:CARDS_DB[id].d,run(){
    done(); (S.deckExtra=S.deckExtra||[]).push(id); SFX.card(); say(`你將【${CARDS_DB[id].n}】納入了戰術牌組。`);
  }}));
  o.ups.forEach(id=>ch.push({t:`✦ 強化【${CARDS_DB[id].n}】`,sub:'該牌所有複本的傷害、護甲與治療效果 ×1.4',run(){
    done(); (S.deckUp=S.deckUp||{})[id]=true; SFX.good(); say(`你對【${CARDS_DB[id].n}】的理解更上一層樓。`);
  }}));
  if(deck.length>8) ['slash','guard'].forEach(id=>{ if(deck.filter(x=>x===id).length>=2) ch.push({t:`✂ 移除一張【${CARDS_DB[id].n}】`,sub:`精簡牌組（目前 ${deck.length} 張），讓強力卡牌更常出現`,run(){
    done(); (S.deckRemoved=S.deckRemoved||[]).push(id); say(`你捨棄了一招多餘的【${CARDS_DB[id].n}】，牌組更加精煉。`);
  }}); });
  ch.push({t:'放棄領悟，轉化為魔力',sub:'魔力 +2',run(){ done(); say('你把這次的感悟化為純粹的魔力。',{magic:2}); }});
  return{title:`${S.rewardSrc||'修行'}後的領悟 · 我思構築`,cg:'cg_orbs',text:`你的戰術牌組目前有 ${deck.length} 張牌。選擇一項成長方向（候選卡牌依你的契約、劍術與位階而定）：`,choices:ch};
}});

const _dap = doApAction;
doApAction = function(type){
  if(!S || !S.alive || S.pending || COMBAT || PUZZLE || S.ap <= 0) return;
  if(type==='quest' || type==='meditate'){
    S.ap--; SFX.click(); if(!S.block) newBlock();
    if(type==='quest'){ S.block.lines.push({t:'【年度行動】你來到協會分部的懸賞告示板前。',d:[],c:'act'}); follow(EV.questBoard); }

    runQueue(); checkLiveAchievements(); autoSave(); render(); return;

  _dap(type);
  if(type==='study' && S.alive && !S.pending && R.c(.3)){ S.rewardSrc='研讀'; S.rewardOpts=null; follow(EV.cardReward); runQueue(); autoSave(); render(); }
};

  for(const e of Object.values(EV)) if(e.hist===S.year&&(!e.when||e.when())) q.push(e);
  const ws=wars();

    const w=ws[0]; S.w=w;

{ const _c2=EV.career.ask; EV.career.ask=function(){ const a=_c2(); if(a.title!=='人生的岔路') return a;
  const add=(id,sub,ok)=>{ if(ok) a.choices.splice(a.choices.length-1,0,{t:JOBS[id].n,sub,run(){takeJob(id)}}); };
  add('guard','維持秩序，薪水穩定',S.str>=7&&S.just>=35);
  add('smuggler','賺快錢，也可能進牢房',S.cha>=8&&S.just<=60);
  add('scribe','安穩的文書工作',S.int>=8);
  add('painter','靠才藝吃飯',S.cha>=8&&S.int>=8);
  add('monk','清貧但寧靜',S.kind>=45);
  add('gladiator','刀口舔血，名利雙收',S.str>=10);
  add('beastmaster','與動物為伴',S.luck>=6);
  add('spy','買賣消息，遊走灰色地帶',S.int>=10&&S.cha>=8);
  add('cook','靠手藝吃飯，人人都要吃飯',true);
  add('miner','辛苦但報酬不差',S.str>=8);
  // 每一世隨機抽選機會：每個符合資格的職業只有約 45% 機率「這輩子有門路」，結果存進角色，讀檔不會重抽
  const all=a.choices.slice(0,-1), last=a.choices[a.choices.length-1];
  S.jobOpp=S.jobOpp||{};
  for(const c of all) if(!(c.t in S.jobOpp)) S.jobOpp[c.t]=Math.random()<.45;
  let keep=all.filter(c=>S.jobOpp[c.t]);
  const rest=all.filter(c=>!keep.includes(c));
  while(keep.length<3&&rest.length){ const c=rest.splice(R.i(0,rest.length-1),1)[0]; S.jobOpp[c.t]=true; keep.push(c); }
  a.choices=keep.concat(last); return a; }; }

def('careerChange',{w:()=>(S.job&&!['slave','student','soldier','sage','mage','vet'].includes(S.job)&&S.age>=24&&S.age<=58)?3:0,age:[24,58],cd:9,ask(){
  const pool=['farmer','craft','merch','scholar','priest','guard','smuggler','scribe','painter','monk','beastmaster','spy','cook','miner','sailor','doctor','bard','alchemist','explorer','innkeeper','hunter'].filter(j=>JOBS[j]&&j!==S.job);
  const opts=[]; while(opts.length<3&&pool.length) opts.push(pool.splice(R.i(0,pool.length-1),1)[0]);
  return{title:'人生的第二次岔路',cg:REG[S.region].cg,text:`做了這麼多年的${JOBS[S.job].n}，你偶爾會想：「如果當初換條路走，會怎樣？」今天，有人向你伸出了橄欖枝。`,choices:opts.map(j=>({t:`改行當${JOBS[j].n}`,sub:'人生還很長',run(){ takeJob(j); say('你放下舊日的工具，從頭開始。',{fame:-1,money:-5}); }})).concat([{t:'繼續現在的生活',sub:'熟悉就是安心',run(){say('你笑了笑，把那個念頭收了起來。',{san:2});}}])};
}});

/* ---------- 18. v6.2：出生固定、星塵削弱、成就與傳承調整 ---------- */
{ const pd=prepareDraft; prepareDraft=function(){
    const pend=null; // 每次開啟新輪迴都重新隨機
    if(pend&&pend.base){ const keep=draftState.diff;
      draftState={diff:keep||0,era:'',customName:pend.customName,alloc:{str:0,int:0,cha:0,luck:0,wis:0},pickedTalents:pend.pickedTalents.slice(),pickedOrigin:pend.pickedOrigin,lockedTalent:pend.lockedTalent,base:JSON.parse(JSON.stringify(pend.base))};
      return; }
    draftState.era=''; draftState.pickedOrigin=''; pd();
    draftState.lockedTalent=draftState.pickedTalents[0]||null;
    META.pendingDraft={base:JSON.parse(JSON.stringify(draftState.base)),customName:draftState.customName,pickedTalents:draftState.pickedTalents.slice(),pickedOrigin:draftState.pickedOrigin,lockedTalent:draftState.lockedTalent};
    saveMeta(); }; }
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-act="toggle-tal"]'); if(!el) return;
  if(draftState&&draftState.lockedTalent&&el.dataset.id===draftState.lockedTalent){ e.stopImmediatePropagation(); e.preventDefault(); toast('命運天賦','這是你降生時就帶來的天賦，無法放棄。'); }
},true);
/* 開啟新輪迴＝覆蓋舊存檔（使用頁內視窗，不依賴瀏覽器 confirm，避免在沙盒/內嵌環境被擋） */
let _ndBypass=false;
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('[data-act="new-draft"],[data-act="new-draft-force"]'); if(!el) return;
  if(el.dataset.act==='new-draft-force'){
    e.stopImmediatePropagation(); e.preventDefault();
    try{ localStorage.removeItem(AUTO_SAVE_KEY); delete META.pendingDraft; saveMeta(); }catch(err){}
    $('#modal').hidden=true; _ndBypass=true;
    const t=document.createElement('button'); t.dataset.act='new-draft'; t.hidden=true; document.body.appendChild(t); t.click(); t.remove(); _ndBypass=false; return;
  }
  if(_ndBypass) return;
  const alive=aliveSave();
  if(alive){
    e.stopImmediatePropagation(); e.preventDefault();
    showModal(`<h2>開啟新輪迴？</h2><p style="color:var(--mute)">目前的存檔「<b style="color:var(--fg)">${esc(alive.name)}</b>・${alive.age} 歲」將被覆蓋，無法復原。</p>
      <div class="ctl" style="margin-top:14px"><button class="btn danger" data-act="new-draft-force">放棄舊存檔，開啟新輪迴</button><button class="btn" data-act="close">保留存檔，取消</button></div>`);
    return;
  }
  try{ localStorage.removeItem(AUTO_SAVE_KEY); }catch(err){}
},true);
ACHIEVEMENTS.forEach(a=>{ a.dust=Math.max(2,Math.round(a.dust*0.35)); });
TAL.forEach(t=>{ if(t.cost) t.cost=Math.round(t.cost*1.8); });
ORIG.forEach(o=>{ if(o.cost) o.cost=Math.round(o.cost*1.8); });
{ const st=document.createElement('style'); st.textContent='.fixed-birth{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;background:rgba(17,21,44,.5)}'; document.head.appendChild(st); }

saveMeta();
if(!(aliveSave() && loadAutoSave())) renderHome();
})();
