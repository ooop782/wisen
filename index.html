<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060812">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>維森人生模擬 v6.9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060812;--bg2:#0c0f21;--panel:#11152c;--panel2:#181e3d;--panel3:#212952;--line:#2b3363;
  --fg:#eeecf8;--mute:#a4a7c8;--dim:#6e729b;
  --gold:#f2d68b;--gold-d:#c4a252;--gold-ink:#211903;
  --fire:#ff8a63;--water:#5ab4ff;--wind:#7be3c0;--earth:#cfa968;--light:#fff0ac;--dark:#a28cff;
  --flesh:#e8566d;--fear:#bcd3ff;--glut:#94d85f;--blind:#b3a9c4;
  --good:#7be3c0;--bad:#ff8c8c;--warn:#f5b963;--san:#6ee7e7;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;min-height:100vh}
body{
  background:
    radial-gradient(1100px 620px at 85% -10%,rgba(98,82,196,.24),transparent 70%),
    radial-gradient(950px 560px at -10% 10%,rgba(42,115,178,.18),transparent 70%),
    radial-gradient(700px 700px at 50% 100%,rgba(232,86,109,.08),transparent 70%),
    var(--bg);
  color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
  overflow-x:hidden;
}
button,select,input{font:inherit;color:inherit}

/* 全螢幕特效與動態背景 */
#bg-cg-canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.22;pointer-events:none;transition:opacity .8s ease}
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#fx-vignette{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 0px rgba(232,86,109,0);transition:box-shadow 1s ease}
#fx-flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;transition:opacity .55s ease}
#toast-box{position:fixed;top:max(14px,env(safe-area-inset-top,14px));right:14px;z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,92vw)}
.toast{background:linear-gradient(135deg,var(--panel2),var(--bg2));border:1px solid var(--gold-d);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.75);font-size:13px;animation:slideIn .28s cubic-bezier(.2,.9,.3,1)}
.toast b{color:var(--gold);display:block;font-size:14px}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.app{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding-top:max(12px,env(safe-area-inset-top,12px))}

/* 頂部導覽列 */
.mast{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid rgba(43,51,99,.75);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.ring{position:relative;width:44px;height:44px;flex:none;animation:spin 45s linear infinite}
.ring i{position:absolute;left:50%;top:50%;width:7.5px;height:7.5px;margin:-3.75px;border-radius:50%;background:var(--c);box-shadow:0 0 11px 2px var(--c);transform:rotate(calc(var(--n)*60deg)) translateY(-17px)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(19px,3.2vw,26px);letter-spacing:.08em;margin:0;line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver-badge{font:700 11px var(--mono);background:linear-gradient(135deg,rgba(242,214,139,.25),rgba(162,140,255,.25));color:var(--gold);border:1px solid var(--gold-d);padding:2px 8px;border-radius:6px;letter-spacing:.05em}
.tag{color:var(--mute);font-size:12px;letter-spacing:.12em;margin:2px 0 0}
.navs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stardust-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(162,140,255,.16);border:1px solid rgba(162,140,255,.5);color:#e4ddff;padding:5px 10px;border-radius:999px;font:600 12.5px var(--mono)}

/* 按鈕 */
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 13px;border-radius:10px;cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;min-height:36px}
.btn:hover:not([disabled]){border-color:var(--gold-d);background:var(--panel3);transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(0)}
.btn.pri{background:linear-gradient(135deg,#f6df9b,#deb860);color:var(--gold-ink);border-color:var(--gold);font-weight:700;box-shadow:0 4px 16px rgba(242,214,139,.22)}
.btn.pri:hover:not([disabled]){background:linear-gradient(135deg,#fae8b4,#e8c673)}
.btn.sec{background:rgba(162,140,255,.18);border-color:rgba(162,140,255,.55);color:#ebe6ff}
.btn.danger{border-color:rgba(232,86,109,.55);color:var(--bad);background:rgba(232,86,109,.1)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px;min-height:30px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.on{border-color:var(--gold);color:var(--gold);background:rgba(242,214,139,.14)}

/* 主選單 */
.title-hero{background:linear-gradient(165deg,rgba(24,30,61,.9),rgba(12,15,33,.95));border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4.5vw,44px) clamp(16px,3.5vw,38px);text-align:center;position:relative;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.65);backdrop-filter:blur(6px)}
.hero-orb-stage{position:relative;width:112px;height:112px;margin:0 auto 14px}
.hero-core{position:absolute;inset:32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#f2d68b 50%,#9b772e);box-shadow:0 0 36px rgba(242,214,139,.55),inset 0 0 12px #fff}
.hero-orbit{position:absolute;inset:0;border:1px dashed rgba(242,214,139,.28);border-radius:50%;animation:spin 24s linear infinite}
.hero-orbit i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--c);box-shadow:0 0 15px 3px var(--c);transform:rotate(calc(var(--n)*60deg)) translateY(-50px)}
.hero-title{font-family:var(--serif);font-weight:900;font-size:clamp(30px,5.5vw,48px);letter-spacing:.14em;margin:0;background:linear-gradient(180deg,#fff,#f2d68b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-family:var(--serif);color:var(--mute);font-size:clamp(12.5px,2vw,15px);letter-spacing:.18em;margin:6px 0 22px}
.hero-menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;max-width:860px;margin:0 auto}
.hero-menu .btn{padding:13px 16px;font-size:15px;border-radius:14px}
.hero-stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid rgba(43,51,99,.65);font-size:12.5px;color:var(--mute)}
.hero-stats b{color:var(--gold);font-family:var(--mono);font-size:14px}

/* 中央曆時間軸 */
.tl{background:linear-gradient(var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:9px 14px 8px;margin-bottom:14px}
.tl-track{position:relative;height:50px;margin:0 6px}
.tl-axis{position:absolute;left:0;right:0;bottom:14px;height:1px;background:var(--line)}
.tl-tick{position:absolute;bottom:0;transform:translateX(-50%);font:10px var(--mono);color:var(--dim)}
.tl-span{position:absolute;height:5px;border-radius:3px;min-width:4px;opacity:.9}
.tl-mark{position:absolute;bottom:14px;width:2px;height:8px;background:var(--dim);transform:translateX(-1px)}
.tl-life{position:absolute;bottom:11px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--gold-d),var(--gold));min-width:4px}
.tl-dot{position:absolute;bottom:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.tl-cap{display:flex;gap:6px 14px;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:3px}
.tl-cap b{color:var(--fg);font-weight:500}
.lg{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* 創角界面 */
.birth{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);display:grid;gap:16px}
.eyebrow{font:11.5px var(--mono);letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.bname-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.name-input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-family:var(--serif);font-size:19px;font-weight:700;color:var(--gold);max-width:240px}
.bwhere{color:var(--mute);margin:4px 0 0;max-width:72ch}
.diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}
.diff-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;text-align:left;transition:all .15s}
.diff-card.active{border-color:var(--gold);background:rgba(242,214,139,.12)}
.diff-card.hard.active{border-color:var(--warn);background:rgba(245,185,99,.12)}
.diff-card.nightmare.active{border-color:var(--flesh);background:rgba(232,86,109,.15)}
.diff-card b{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:3px}
.diff-card small{display:block;color:var(--mute);font-size:12px;line-height:1.4}
.alloc-box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.alloc-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.bstat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.bstat span{font-size:12px;color:var(--mute)}
.bstat-row{display:flex;align-items:center;justify-content:space-between}
.bstat b{font:600 19px var(--mono)}
.pt-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pt-btn:hover:not([disabled]){border-color:var(--gold);color:var(--gold)}
.pt-btn[disabled]{opacity:.3;cursor:not-allowed}
.tal-picker{display:flex;flex-wrap:wrap;gap:7px}
.tal-opt{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;transition:all .15s;text-align:left}
.tal-opt.picked{border-color:var(--gold);background:rgba(242,214,139,.15);color:var(--gold)}
.tal-opt small{display:block;color:var(--mute);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg)}
.chip.c-fire{border-color:var(--fire);color:var(--fire)}.chip.c-water{border-color:var(--water);color:var(--water)}
.chip.c-wind{border-color:var(--wind);color:var(--wind)}.chip.c-earth{border-color:var(--earth);color:var(--earth)}
.chip.c-light{border-color:var(--light);color:var(--light)}.chip.c-dark{border-color:var(--dark);color:var(--dark)}
.chip.c-mind{border-color:var(--gold);color:var(--gold)}
.chip.c-flesh{border-color:var(--flesh);color:var(--flesh)}.chip.c-fear{border-color:var(--fear);color:var(--fear)}
.chip.c-glut{border-color:var(--glut);color:var(--glut)}.chip.c-blind{border-color:var(--blind);color:var(--blind)}
.chip.c-fallen{border-color:var(--dim);color:var(--mute);border-style:dashed}
.chip.tal{border-color:var(--gold-d);color:var(--gold)}
.omen{font-family:var(--serif);color:var(--mute);border-left:2px solid var(--gold-d);padding-left:14px;margin:0}
.ctl{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
select{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 11px}

/* 主遊戲雙欄佈局 */
.game{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;position:sticky;top:10px;min-width:0}
.sheet .nm{font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.25}
.sheet .meta{color:var(--mute);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.diff-tag{font:600 10.5px var(--mono);padding:1px 6px;border-radius:5px;border:1px solid}
.diff-tag.d0{color:var(--good);border-color:rgba(123,227,192,.4)}
.diff-tag.d1{color:var(--warn);border-color:rgba(245,185,99,.5)}
.diff-tag.d2{color:var(--flesh);border-color:rgba(232,86,109,.6)}
.agebox{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;background:var(--bg2);padding:7px 11px;border-radius:10px;border:1px solid var(--line)}
.agebox b{font:600 32px/1 var(--mono);color:var(--gold)}
.agebox span{color:var(--mute);font-size:12.5px}
.agebox em{font:11.5px var(--mono);color:var(--dim);font-style:normal;margin-left:auto}
.ap-pills{display:flex;gap:4px;align-items:center}
.ap-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ap-dot.used{background:var(--line);box-shadow:none}
.bar{display:grid;gap:2px}
.bar .lb{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.bar .lb b{font:500 12px var(--mono);color:var(--fg)}
.bar .tr{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.bar .fl{height:100%;border-radius:3px;background:var(--good);transition:width .3s}
.bar.san .fl{background:linear-gradient(90deg,#3b82f6,var(--san))}
.bar.corr .fl{background:linear-gradient(90deg,var(--dark),var(--flesh))}
.bar.thin .tr{height:4px}.bar.thin .fl{background:var(--gold-d)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stats div{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 0;text-align:center}
.stats span{display:block;font-size:10.5px;color:var(--mute)}
.stats b{font:600 14.5px var(--mono)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.debt-alert{background:rgba(232,86,109,.15);border:1px solid var(--flesh);border-radius:9px;padding:6px 10px;font-size:12px;color:#ffb0bc}
.sub-h{font:11px var(--mono);letter-spacing:.14em;color:var(--dim);margin:0 0 4px;text-transform:uppercase}

/* 右側舞台與分頁 */
.stage{display:grid;gap:12px;min-width:0}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.tab{flex:1;min-width:88px;padding:8px 9px;border-radius:8px;border:none;background:transparent;color:var(--mute);cursor:pointer;font-weight:500;font-size:13px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.tab.active{background:var(--panel3);color:var(--gold);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.badge-cnt{background:rgba(242,214,139,.2);color:var(--gold);font:10.5px var(--mono);padding:1px 5px;border-radius:999px;margin-left:3px}

/* 年度行動點列 */
.ap-bar{background:linear-gradient(135deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;gap:8px}
.ap-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute);flex-wrap:wrap;gap:6px}
.ap-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px}
.act-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;text-align:left;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:2px}
.act-card:hover:not([disabled]){border-color:var(--gold);background:var(--panel3);transform:translateY(-1px)}
.act-card[disabled]{opacity:.38;cursor:not-allowed}
.act-card b{font-size:13px;color:var(--fg);display:flex;justify-content:space-between}
.act-card b span{font:10.5px var(--mono);color:var(--gold)}
.act-card small{font-size:11px;color:var(--mute);line-height:1.3}

/* 命運抉擇框與原畫級 CG 展示區 */
.fate{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--gold-d);border-radius:16px;overflow:hidden;box-shadow:0 0 44px rgba(242,214,139,.12)}
.fate-cg-wrap{position:relative;width:100%;height:clamp(155px,24vw,225px);background:#070914;border-bottom:1px solid var(--gold-d);overflow:hidden}
.fate-cg-wrap canvas{width:100%;height:100%;display:block}
.fate-cg-cap{position:absolute;left:12px;bottom:8px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.fate-cg-cap span{background:rgba(6,8,18,.78);backdrop-filter:blur(4px);border:1px solid rgba(242,214,139,.4);color:var(--gold);font:11.5px var(--serif);padding:3px 10px;border-radius:999px}
.fate-body{padding:clamp(14px,2.6vw,22px)}
.fate h2{font-family:var(--serif);font-size:clamp(18px,2.6vw,23px);margin:0 0 6px;font-weight:900;color:var(--gold)}
.fate p{margin:0 0 12px;color:var(--fg);max-width:68ch}
.choices{display:grid;gap:7px}
.choice{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;cursor:pointer;transition:all .15s}
.choice:hover{border-color:var(--gold);background:var(--panel3);transform:translateX(3px)}
.choice b{display:block;font-weight:700;font-size:14px}
.choice small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.choice.bad b{color:var(--bad)}

.end{background:linear-gradient(160deg,#221a50,var(--panel));border:1px solid var(--dark);border-radius:16px;padding:clamp(18px,3vw,26px);display:grid;gap:12px}
.end h2{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.6vw,30px);margin:0}
.end .rank{font:600 50px/1 var(--mono);color:var(--gold);text-shadow:0 0 24px rgba(242,214,139,.4)}
.end .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dust-reward{background:rgba(162,140,255,.16);border:1px solid var(--dark);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* ==================== 古殿符文機械儀球解謎機關 ==================== */
.puzzle-overlay{
  position:fixed;inset:0;z-index:78;background:rgba(4,5,14,.92);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto;
}
.puzzle-box{
  background:linear-gradient(165deg,#181d3d,#0a0d1d);border:1px solid var(--gold-d);
  border-radius:20px;max-width:680px;width:100%;padding:clamp(16px,3vw,26px);
  box-shadow:0 24px 80px rgba(0,0,0,.85);display:grid;gap:14px;text-align:center;
}
.puzzle-canvas-wrap{position:relative;width:min(330px,82vw);height:min(330px,82vw);margin:0 auto}
.puzzle-canvas-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 40px rgba(242,214,139,.2)}
.puzzle-controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* ==================== 7x7 夢境彼岸迷宮 ==================== */
.maze-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
.maze-board{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
  background:radial-gradient(circle at center,#181c3d,#090b18);
  border:1px solid var(--line);border-radius:14px;padding:9px;aspect-ratio:1/1;max-width:440px;width:100%;margin:0 auto;
}
.cell{
  border-radius:8px;border:1px solid rgba(43,51,99,.7);background:#0d1024;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:17px;position:relative;cursor:default;transition:all .16s;user-select:none;
}
.cell.fog{background:#070914;border-color:#151933;color:transparent}
.cell.adj{border-color:var(--gold-d);cursor:pointer;box-shadow:inset 0 0 12px rgba(242,214,139,.18)}
.cell.adj:hover{border-color:var(--gold);background:var(--panel3);transform:scale(1.04)}
.cell.player{background:radial-gradient(circle,rgba(242,214,139,.35),var(--panel2));border-color:var(--gold);box-shadow:0 0 14px rgba(242,214,139,.4)}
.cell.shadow{border-color:var(--flesh);background:rgba(232,86,109,.18);animation:pulseShadow 1.6s infinite}
@keyframes pulseShadow{0%,100%{box-shadow:inset 0 0 8px rgba(232,86,109,.3)}50%{box-shadow:inset 0 0 18px rgba(232,86,109,.7)}}
.cell small{font:9.5px var(--mono);color:var(--mute);line-height:1}

/* ==================== 回合制《我思構築》戰術卡牌戰鬥視窗 ==================== */
.combat-overlay{
  position:fixed;inset:0;z-index:75;background:rgba(4,5,14,.92);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:12px;overflow-y:auto;
}
.combat-arena{
  background:linear-gradient(170deg,#161b3a,#0b0e1f);border:1px solid var(--gold-d);
  border-radius:20px;max-width:920px;width:100%;padding:clamp(14px,2.5vw,24px);
  box-shadow:0 24px 80px rgba(0,0,0,.85);display:grid;gap:12px;
}
.combat-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.combatant{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px}
.combatant.enemy{border-color:rgba(232,86,109,.55)}
.combatant-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:6px}
.combatant-hd b{font-family:var(--serif);font-size:16px}
.intent-box{background:rgba(232,86,109,.16);border:1px solid var(--flesh);color:#ffb3bf;padding:5px 9px;border-radius:8px;font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.status-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.st-badge{font:11px var(--mono);padding:2px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.combat-log{background:#080a16;border:1px solid var(--line);border-radius:10px;padding:7px 11px;height:70px;overflow-y:auto;font-size:12.5px;color:var(--mute)}
.combat-log p{margin:0 0 3px}
.hand-area{display:grid;gap:8px}
.hand-hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cogito-orb{display:inline-flex;align-items:center;gap:6px;background:rgba(90,180,255,.18);border:1px solid var(--water);color:#cbe7ff;padding:4px 12px;border-radius:999px;font:600 13px var(--mono)}
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}
.t-card{
  background:linear-gradient(160deg,var(--panel2),var(--bg2));border:1px solid var(--line);
  border-radius:12px;padding:9px;text-align:left;cursor:pointer;transition:all .16s;
  display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-height:112px;position:relative;
}
.t-card:hover:not([disabled]){border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.t-card[disabled]{opacity:.38;cursor:not-allowed}
.t-card.c-fire{border-color:rgba(255,138,99,.5)}.t-card.c-water{border-color:rgba(90,180,255,.5)}
.t-card.c-wind{border-color:rgba(123,227,192,.5)}.t-card.c-earth{border-color:rgba(207,169,104,.5)}
.t-card.c-light{border-color:rgba(255,240,172,.5)}.t-card.c-dark{border-color:rgba(162,140,255,.5)}
.t-card.c-evil{border-color:rgba(232,86,109,.65);background:linear-gradient(160deg,#2a1220,var(--bg2))}
.t-card-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.t-card-hd b{font-size:13px;line-height:1.25}
.cost-gem{background:var(--water);color:#041224;font:700 11.5px var(--mono);width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.t-card small{font-size:11px;color:var(--mute);line-height:1.3}
.t-card-type{font:10px var(--mono);color:var(--dim);text-transform:uppercase}

/* 通用卡片與網格 */
.panel-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
.item-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;gap:7px}
.item-card.equipped{border-color:var(--gold-d);background:rgba(242,214,139,.06)}
.item-card.artifact{border-color:var(--dark);background:linear-gradient(145deg,rgba(162,140,255,.12),var(--bg2))}
.item-card.damaged{border-color:var(--bad);background:rgba(232,86,109,.08)}
.item-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.item-hd b{font-size:14px}
.tag-pill{font:10.5px var(--mono);padding:2px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.rel-bar{height:5px;background:var(--panel);border-radius:3px;overflow:hidden;margin-top:4px}
.rel-fill{height:100%;background:linear-gradient(90deg,var(--water),var(--wind))}

/* CG 畫廊卡片 */
.cg-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cg-card.unlocked{border-color:var(--gold-d)}
.cg-thumb{width:100%;aspect-ratio:16/9;background:#070914;display:block;cursor:pointer}
.cg-meta{padding:9px 11px;display:flex;flex-direction:column;gap:5px}

/* 年表日誌 */
.log{display:grid;gap:10px}
.year{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 15px}
.year.cur{border-color:#444d96}
.yh{font:11.5px var(--mono);letter-spacing:.14em;color:var(--gold);margin-bottom:5px;display:flex;justify-content:space-between}
.ln{margin:0 0 6px;color:var(--fg);max-width:72ch;overflow-wrap:anywhere;font-size:14.5px}
.ln:last-child{margin-bottom:0}
.ln.news{color:var(--water);font-size:13.5px;border-left:2px solid var(--water);padding-left:10px}
.ln.pick{color:var(--gold);font-size:13.5px}
.ln.act{color:var(--wind);font-size:13.5px}
.ln.dread{color:var(--flesh)}
.ln.fin{color:var(--dark);font-family:var(--serif);font-weight:600}
.dl{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:5px;vertical-align:baseline}
.dc{font:11px var(--mono);padding:0 5px;border-radius:4px;border:1px solid}
.dc.g{color:var(--good);border-color:rgba(123,227,192,.4)}
.dc.b{color:var(--bad);border-color:rgba(255,140,140,.4)}

/* 底部操作列（Android 觸控安全區適配） */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(transparent,rgba(6,8,18,.96) 32%);padding:18px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1260px;margin:0 auto;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dock-in .st{margin-right:auto;color:var(--mute);font-size:13px}
.dock .btn.pri{padding:11px 22px;font-size:15.5px}

/* 彈窗 */
.modal{position:fixed;inset:0;z-index:65;background:rgba(4,5,14,.88);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:900px;width:100%;padding:clamp(16px,3vw,28px);margin:auto 0;box-shadow:0 24px 64px rgba(0,0,0,.8)}
.modal h2{font-family:var(--serif);font-weight:900;margin:0 0 10px;font-size:22px}
.modal h3{font-family:var(--serif);color:var(--gold);margin:16px 0 7px;font-size:16px}
.modal .x{float:right}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tw{overflow-x:auto}
.ach-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px;opacity:.52}
.ach-card.unlocked{opacity:1;border-color:var(--gold-d);background:linear-gradient(145deg,rgba(242,214,139,.1),var(--bg2))}
.save-slot{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

@media(max-width:880px){
  .game{grid-template-columns:1fr}
  .sheet{position:static}
  .maze-wrap{grid-template-columns:1fr}
  .combat-top{grid-template-columns:1fr}
}
@media(max-width:520px){
  .agebox b{font-size:28px}
  .dock .btn.pri{flex:1}
  .navs{width:100%;justify-content:flex-start}
}
</style>

<script>
(function(){
'use strict';

/* ==================== 1. Web Audio API 程式合成音效與空靈配樂 ==================== */
const SFX = (function(){
  let ctx = null, enabled = true, bgmTimer = null;
  function init(){
    if(!ctx) try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    if(ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, type, dur, vol, delay=0){
    if(!enabled) return;
    init(); if(!ctx) return;
    const t = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function startAmbient(){
    if(bgmTimer) return;
    const scale = [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 659.25];
    bgmTimer = setInterval(()=>{
      if(!enabled || !ctx || ctx.state !== 'running') return;
      if(Math.random() < 0.7){
        const f = scale[Math.floor(Math.random()*scale.length)];
        tone(f, 'sine', 3.8, 0.015, 0);
      }
    }, 2800);
  }
  return {
    get on(){ return enabled; },
    toggle(){ enabled = !enabled; if(enabled){ init(); startAmbient(); this.click(); } return enabled; },
    boot(){ init(); startAmbient(); },
    click(){ tone(580, 'sine', 0.08, 0.035); },
    gear(){ tone(240, 'triangle', 0.14, 0.05); tone(360, 'sine', 0.12, 0.03, 0.05); },
    card(){ tone(680, 'triangle', 0.1, 0.045); tone(880, 'sine', 0.12, 0.03, 0.04); },
    hit(){ tone(140, 'sawtooth', 0.18, 0.055); tone(95, 'square', 0.2, 0.04, 0.04); },
    shield(){ tone(420, 'triangle', 0.22, 0.045); tone(630, 'sine', 0.25, 0.035, 0.05); },
    step(){ tone(310, 'sine', 0.09, 0.03); },
    turn(){ tone(330, 'triangle', 0.14, 0.03); tone(440, 'sine', 0.18, 0.025, 0.05); },
    orb(){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, 'sine', 0.55, 0.04, i*0.08)); },
    good(){ [440, 554.37, 659.25].forEach((f,i)=>tone(f, 'triangle', 0.35, 0.04, i*0.07)); },
    dread(){ tone(110, 'sawtooth', 0.75, 0.05); tone(98, 'sine', 0.9, 0.05, 0.1); },
    death(){ [392, 349.23, 311.13, 261.63].forEach((f,i)=>tone(f, 'sine', 0.7, 0.045, i*0.22)); },
    ach(){ [523.25, 659.25, 783.99, 987.77, 1046.5].forEach((f,i)=>tone(f, 'triangle', 0.45, 0.045, i*0.06)); }
  };
})();

/* ==================== 2. 幾何風格 CG 繪圖引擎（程序化生成，無點陣圖） ==================== */
const CG_GALLERY = [
  { id:'cg_tower', n:'羅爾斯蘭德・魔法大學星夜尖塔', era:'中央曆 1 年起', d:'月輪、星點與層疊的幾何尖塔，石階通往雲端。' },
  { id:'cg_orbs', n:'彼岸夢境・六元素光球', era:'夢境覺醒', d:'火、水、風、地、明、暗六色光球以同心圓環環繞，靜靜等待契約者。' },
  { id:'cg_tree', n:'無上宗者羅爾斯的巨樹', era:'前中央曆 13 年封印', d:'由三角與圓構成的靈樹，將夢境之底的紅色漩渦牢牢鎮壓。' },
  { id:'cg_dragon', n:'中央曆 140 年・古龍降臨', era:'第三次彼岸魔戰爭', d:'暗紅天幕下展開巨翼的三角古龍，懸崖上的戰士仰望希望。' },
  { id:'cg_evil', n:'夢魘之底・四大邪神幻影', era:'深淵低語', d:'紫紅的巨眼與黑色石柱，唯有堅定的意志才能直視。' },
  { id:'cg_desert', n:'塔薩蘇拉・金色綠洲宮殿', era:'大沙漠帝國', d:'波浪狀沙丘、金色圓頂與落日，見證 215 年的解放聖戰。' },
  { id:'cg_astrolabe', n:'古殿機械儀球・封印機關', era:'古代王國遺跡', d:'同心星盤、刻度與齒輪，轉動到正確星象方能開啟秘庫。' },
  { id:'cg_forest', n:'黑森林帝國・諸侯古堡', era:'中央曆 25 年成立', d:'層層松林剪影與雉堞城堡，萊克斯汀與薩森的旗幟迎風招展。' },
  { id:'cg_snow', n:'維特爾沙皇國・極光雪原', era:'中央曆 97 年異動', d:'極光色帶與雪峰三角，哨塔最先望見西方的黑霧。' },
  { id:'cg_church', n:'神教國聖殿・正念神祭壇', era:'中央曆 210 年創立', d:'白色列柱間灑下仁慈、公正、自由、智慧四道光。' },
  { id:'cg_finalwar', n:'中央曆 199 年・西海岸總攻', era:'百年戰爭終局', d:'斜飛的星雨、火焰與古龍輪廓，彼岸魔大軍在此潰散。' },
  { id:'cg_imprint', n:'我思印刻・傳世神器誕生', era:'終末傳承', d:'無數光點匯聚成劍，法師的靈魂化為流芳後世的神器。' }
];
const GEO_PAL = {
  cg_tower:['#070b24','#3b3f94','#f2d68b','#7be3c0','#1a1f55'], cg_orbs:['#04050f','#1c1440','#a28cff','#5ab4ff','#ff8a63'],
  cg_tree:['#050a1a','#12365e','#7be3c0','#bcd3ff','#4b1030'], cg_dragon:['#2a0710','#a8321f','#f2d68b','#ff8a63','#1a0508'],
  cg_evil:['#08030f','#3b0f3f','#e8566d','#a28cff','#150418'], cg_desert:['#3a1a0a','#e8a24a','#f2d68b','#fff0ac','#7a3d12'],
  cg_astrolabe:['#07101c','#1b3350','#f2d68b','#5ab4ff','#0d1b2d'], cg_forest:['#06100c','#1d4a3a','#94d85f','#e8566d','#0a1f18'],
  cg_snow:['#050c1c','#1d3f6e','#7be3c0','#a28cff','#dfeaff'], cg_church:['#101636','#8f9be0','#fff0ac','#7be3c0','#eef0ff'],
  cg_finalwar:['#1a0510','#c2452b','#f2d68b','#5ab4ff','#2a0a14'], cg_imprint:['#05050f','#1d1a47','#f2d68b','#a28cff','#7be3c0'],
  cg_road:['#14204a','#f0a46a','#f2d68b','#7be3c0','#243a2e'], cg_village:['#0e1638','#e08a63','#f2d68b','#ff8a63','#2a1f3d'],
  cg_war:['#1c0610','#9c2b2b','#f2d68b','#cfa968','#2a0a10']
};
function _hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function _rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function drawCG(canvas, cgId){
  if(!canvas) return;
  const W = canvas.width = 960, H = canvas.height = 540;
  const c = canvas.getContext('2d');
  const id = GEO_PAL[cgId] ? cgId : 'cg_tower', P = GEO_PAL[id], rnd = _rng(_hash(id));

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const R={i:(a,b)=>Math.floor(Math.random()*(b-a+1))+a,r:(a,b)=>a+Math.random()*(b-a),p:a=>a[Math.floor(Math.random()*a.length)],c:p=>Math.random()<p};
function pickW(list,wf){wf=wf||(x=>x.w);let t=0;for(const x of list)t+=Math.max(0,wf(x));if(t<=0)return list[0];let r=Math.random()*t;for(const x of list){r-=Math.max(0,wf(x));if(r<=0)return x}return list[list.length-1]}

function loadMeta(){
  try{ return Object.assign(defaultMeta(), JSON.parse(localStorage.getItem(META_KEY) || 'null') || {}); }
  catch(e){ return defaultMeta(); }
}
function saveMeta(){
  try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){}
  const dv = $('#dust-val'); if(dv) dv.textContent = META.dust;
}
function toast(title, desc){
  const box = $('#toast-box'); if(!box) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<b>${esc(title)}</b><span>${esc(desc)}</span>`;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),320); }, 3400);
}
function flashScreen(color){
  const el = $('#fx-flash'); if(!el) return;
  el.style.background = `radial-gradient(circle, transparent 40%, ${color} 100%)`;
  el.style.opacity = '0.85';
  setTimeout(()=>{ el.style.opacity = '0'; }, 550);
}
function unlockAch(id){
  if(META.achievements.includes(id)) return;
  const a = ACHIEVEMENTS.find(x=>x.id===id);
  if(!a) return;
  META.achievements.push(id);
  META.dust += a.dust;
  saveMeta();
  SFX.ach();
  flashScreen('rgba(242,214,139,0.5)');
  toast(`🏆 達成成就：${a.n}`, `${a.d}（+${a.dust} 星塵）`);
}

/* ==================== 5. 互動式「古殿符文儀球」解謎機關 ==================== */
let PUZZLE = null;

function startAstrolabePuzzle(cfg){
  unlockCG('cg_astrolabe');
  // 3 層同心圓盤，每層 6 個刻度（0..5），目標為全部對齊至 0（正上方星辰北極）
  const rings = [R.i(1,5), R.i(1,5), R.i(1,5)];
  PUZZLE = {
    title: cfg.title || '古殿機械儀球・封印機關',
    text: cfg.text || '轉動三層刻滿維森符文的金色儀球星盤，使三道藍色符文光束同時對準正上方的北極星門！',
    rings,
    moves: 0,
    maxMoves: 12,
    onWin: cfg.onWin,
    onFail: cfg.onFail
  };
  renderPuzzle();
}

function rotatePuzzleRing(idx, dir){
  if(!PUZZLE) return;
  SFX.gear();
  PUZZLE.moves++;
  // 聯動機械齒輪機制：轉動外環(0)會連帶中環(1)走1格；轉動中環(1)單獨移動；轉動內環(2)會反向帶動外環(0)
  if(idx === 0){
    PUZZLE.rings[0] = (PUZZLE.rings[0] + dir + 6) % 6;
    PUZZLE.rings[1] = (PUZZLE.rings[1] + dir + 6) % 6;
  }else if(idx === 1){
    PUZZLE.rings[1] = (PUZZLE.rings[1] + dir + 6) % 6;
  }else{
    PUZZLE.rings[2] = (PUZZLE.rings[2] + dir + 6) % 6;
    PUZZLE.rings[0] = (PUZZLE.rings[0] - dir + 6) % 6;
  }

  const solved = PUZZLE.rings.every(v => v === 0);
  if(solved){
    const p = PUZZLE; PUZZLE = null;
    $('#puzzle-modal').hidden = true;
    SFX.orb(); flashScreen('rgba(242,214,139,0.55)');
    unlockAch('puzzle_master');
    if(!S.block) newBlock();
    if(p.onWin) p.onWin(p.moves);
    if(S.alive && !COMBAT) runQueue();
    checkLiveAchievements(); autoSave(); render();
    return;
  }
  if(PUZZLE.moves >= PUZZLE.maxMoves){
    const p = PUZZLE; PUZZLE = null;
    $('#puzzle-modal').hidden = true;
    SFX.dread();
    if(!S.block) newBlock();
    if(p.onFail) p.onFail();
    if(S.alive && !COMBAT) runQueue();
    checkLiveAchievements(); autoSave(); render();
    return;
  }
  renderPuzzle();
}

function abortPuzzle(){
  if(!PUZZLE) return;
  const p = PUZZLE; PUZZLE = null;
  $('#puzzle-modal').hidden = true;
  if(!S.block) newBlock();
  say('你謹慎地收手，沒有強行破解古殿機械儀球。', {});
  if(S.alive && !COMBAT) runQueue();
  render();
}

function renderPuzzle(){
  const modal = $('#puzzle-modal');
  if(!PUZZLE){ modal.hidden = true; return; }
  modal.hidden = false;
  const p = PUZZLE;
  modal.innerHTML = `
    <div class="puzzle-box">
      <div class="eyebrow">⚙️ 古殿符文機械機關</div>
      <h2 style="font-family:var(--serif);color:var(--gold);margin:0">${esc(p.title)}</h2>
      <p style="margin:0;font-size:13.5px;color:var(--mute)">${esc(p.text)}<br>
      <small style="color:var(--san)">機械聯動提示：轉動外環會帶動中環；轉動內環會反向帶動外環。剩餘步數：<b>${p.maxMoves - p.moves}</b></small></p>
      <div class="puzzle-canvas-wrap">
        <canvas id="puzzle-cvs"></canvas>
      </div>
      <div class="puzzle-controls">
        <button class="btn sm" data-act="pz-rot" data-r="0" data-d="-1">↺ 外環左轉</button>
        <button class="btn sm" data-act="pz-rot" data-r="0" data-d="1">↻ 外環右轉</button>
        <button class="btn sm" data-act="pz-rot" data-r="1" data-d="-1">↺ 中環左轉</button>
        <button class="btn sm" data-act="pz-rot" data-r="1" data-d="1">↻ 中環右轉</button>
        <button class="btn sm" data-act="pz-rot" data-r="2" data-d="-1">↺ 內環左轉</button>
        <button class="btn sm" data-act="pz-rot" data-r="2" data-d="1">↻ 內環右轉</button>
      </div>
      <div>
        <button class="btn danger sm" data-act="pz-abort">放棄破解離開</button>
      </div>
    </div>`;

  // 繪製三層同心符文儀球
  const cvs = $('#puzzle-cvs');
  if(cvs){
    const ctx = cvs.getContext('2d');
    const size = cvs.width = cvs.height = 360;
    const cx = 180, cy = 180;
    ctx.fillStyle = '#070914'; ctx.fillRect(0,0,size,size);

    // 頂部目標鎖孔標記
    ctx.fillStyle = '#5ab4ff';
    ctx.beginPath(); ctx.moveTo(cx, 6); ctx.lineTo(cx-10, 22); ctx.lineTo(cx+10, 22); ctx.closePath(); ctx.fill();

    const radii = [142, 102, 62];
    const runes = ['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ'];
    radii.forEach((rad, rIdx)=>{
      ctx.strokeStyle = p.rings[rIdx]===0 ? '#7be3c0' : '#c4a252';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();

      for(let s=0;s<6;s++){
        const slot = (s + p.rings[rIdx]) % 6;
        const ang = (slot / 6) * Math.PI * 2 - Math.PI / 2;
        const rx = cx + Math.cos(ang) * rad;
        const ry = cy + Math.sin(ang) * rad;
        ctx.fillStyle = s === 0 ? (p.rings[rIdx]===0 ? '#7be3c0' : '#5ab4ff') : '#1c2347';
        ctx.beginPath(); ctx.arc(rx,ry,14,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#f2d68b'; ctx.lineWidth = 1.5; ctx.stroke();

        ctx.fillStyle = s === 0 ? '#05121c' : '#f2d68b';
        ctx.font = 'bold 14px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(runes[s], rx, ry);
      }
    });
    // 中央儀球核心
    const g = ctx.createRadialGradient(cx,cy,2,cx,cy,28);
    g.addColorStop(0,'#fff6d6'); g.addColorStop(1,'#5ab4ff');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx,cy,26,0,Math.PI*2); ctx.fill();
  }
}

/* ==================== 8. 7x7 夢境彼岸迷宮 ==================== */
function initMaze(){
  if(!S) return;
  const size = 7, grid = [];
  for(let r=0;r<size;r++){
    const row = [];
    for(let c=0;c<size;c++) row.push({ r, c, type:'empty', vis:false, label:'' });
    grid.push(row);
  }
  const px = 3, py = 3;
  grid[py][px].vis = true;

  const place = (type, icon, label, count) => {
    let placed = 0, guard = 0;
    while(placed < count && guard < 120){
      guard++;
      const rx = R.i(0,6), ry = R.i(0,6);
      if((rx===px && ry===py) || grid[ry][rx].type !== 'empty') continue;
      grid[ry][rx].type = type; grid[ry][rx].icon = icon; grid[ry][rx].label = label;
      placed++;
    }
  };
  place('orb', '🔮', '元素光球', 2);
  place('crystal', '💎', '我思結晶', 3);
  place('altar', '⛩️', '正念祭壇', 2);
  place('rift', '🌀', '墮落裂隙', 2);
  place('chest', '📦', '遺忘記憶', 3);

  const shadows = [];
  const shadowCount = S.diff === 2 ? 3 : 2;
  for(let i=0;i<shadowCount;i++){
    let sx = R.c(.5)?0:6, sy = R.i(0,6);
    if(sx===px && sy===py) sx = 0;
    shadows.push({ x:sx, y:sy, name: R.p(['血肉孽影','恐懼幽魂','暴食蠕蟲','盲目低語者']) });
  }
  S.maze = { size, grid, px, py, shadows, floor: (S.maze ? S.maze.floor + 1 : 1) };
  revealAround(px, py);
}

function revealAround(x, y){
  if(!S || !S.maze) return;
  const rad = hasT('dream') ? 2 : 1;
  for(let dy=-rad; dy<=rad; dy++){
    for(let dx=-rad; dx<=rad; dx++){
      if(Math.abs(dx)+Math.abs(dy) > rad) continue;
      const nx = x+dx, ny = y+dy;
      if(nx>=0 && nx<7 && ny>=0 && ny<7) S.maze.grid[ny][nx].vis = true;
    }
  }
}

function stepMaze(tx, ty){
  if(!S || !S.alive || !S.awakened || !S.maze) return;
  if(S.mazeSteps <= 0){ toast('精神力耗盡', '本年度夢境步數已用盡，請推進下一年或使用「夢境引導香」。'); return; }
  const m = S.maze;
  if(Math.abs(tx - m.px) + Math.abs(ty - m.py) !== 1) return;

  SFX.step();
  S.mazeSteps--;
  m.px = tx; m.py = ty;
  revealAround(tx, ty);
  const cell = m.grid[ty][tx];
  if(!S.block) newBlock();

  if(cell.type === 'orb'){
    cell.type = 'empty'; cell.icon = ''; cell.label = '';
    SFX.orb(); unlockCG('cg_orbs');
    if(slots().length < cap()){
      offerOrb();
      say('【夢境彼岸】你在迷霧深處觸碰到一團純粹的元素光球！', {wis:1});

    SFX.good();
    say('【夢境彼岸】你吸收了遠古我思結晶，靈魂容量擴張！', {wis:2, magic:5, san:8});
  }else if(cell.type === 'altar'){
    cell.type = 'empty'; cell.icon = ''; cell.label = '';
    SFX.good();
    say('【夢境彼岸】你在正念祭壇前靜坐，邪神低語被聖潔光芒驅散。', {corr:-14, san:18, kind:3});
  }else if(cell.type === 'chest'){
    cell.type = 'empty'; cell.icon = ''; cell.label = '';
    if(R.c(0.5)){
      const g = R.i(18, 42);
      say(`【夢境彼岸】你從古代法師的記憶碎片中領悟了生財之道（獲得 ${g} 銀幣線索）。`, {money:g, int:1});
    }else{
      say('【夢境彼岸】你在夢境殘骸中拾獲一瓶「安神鎮定劑」！', {wis:1});
      S.inventory.push(Object.assign({}, ITEMS_DB.san_tonic));
    }
  }else if(cell.type === 'rift'){
    cell.type = 'empty'; cell.icon = ''; cell.label = '';
    SFX.dread(); unlockCG('cg_evil');
    S.pending = {
      title:'夢境彼岸：墮落裂隙', cg:'cg_evil',
      text:'一道散發著紫紅色不祥氣息的裂隙橫亙在眼前，裡面傳出強大的魔力波動與邪神的誘惑。',
      choices:[
        {t:'汲取裂隙深淵魔力',sub:'魔力 +14，但邪神侵蝕 +16、理智 -15',bad:true,run(){
          if(!S.evil) S.evil = pickGod();
          say('深淵魔力湧入四肢百骸，你的眼底閃過一絲異光。',{magic:14, corr:16, san:-15},null,'dread');
        }},
        {t:'以自身意志封印裂隙',sub:'需要我思 ≥ 8，獲得聲望與正念',ok:()=>S.wis>=8,run(){
          say('你以堅定的我思縫合了空間裂隙，夢境恢復了平靜。',{fame:6, just:4, san:10});
        }},
        {t:'謹慎繞開',run(){ say('你沒有觸碰危險的裂隙，轉身離去。'); }}
      ]
    };
  }

  for(const sh of m.shadows){
    const dx = Math.sign(m.px - sh.x), dy = Math.sign(m.py - sh.y);
    if(R.c(0.65)){
      if(Math.abs(m.px - sh.x) >= Math.abs(m.py - sh.y)) sh.x = clamp(sh.x + dx, 0, 6);
      else sh.y = clamp(sh.y + dy, 0, 6);
    }
    if(sh.x === m.px && sh.y === m.py){
      SFX.dread(); flashScreen('rgba(232,86,109,0.6)'); unlockCG('cg_evil');

let COMBAT = null;

function buildPlayerDeck(){
  const deck = [CARDS_DB.slash, CARDS_DB.slash, CARDS_DB.slash, CARDS_DB.guard, CARDS_DB.guard, CARDS_DB.guard];
  if(hasT('sword') || S.lic.sword >= 1) deck.push(CARDS_DB.iaido);
  if(S.equip.weapon && S.equip.weapon.id === 'sword_iron') deck.push(CARDS_DB.steel_combo);
  if(S.equip.weapon && S.equip.weapon.id === 'staff_oak') deck.push(CARDS_DB.arcane_bolt);
  if(S.origin === 'dragon_blood' || hasT('dragon')) deck.push(CARDS_DB.dragon_breath);
  if(S.origin === 'rors_desc') deck.push(CARDS_DB.mind_wis);

  for(const o of orbs()){
    if(o.key==='fire') deck.push(CARDS_DB.fireball, CARDS_DB.fireball);
    if(o.key==='water') deck.push(CARDS_DB.ice_shield, CARDS_DB.ice_shield);
    if(o.key==='wind') deck.push(CARDS_DB.wind_flurry, CARDS_DB.wind_flurry);
    if(o.key==='earth') deck.push(CARDS_DB.earth_wall, CARDS_DB.earth_wall);
    if(o.key==='light') deck.push(CARDS_DB.star_heal, CARDS_DB.star_heal);
    if(o.key==='dark') deck.push(CARDS_DB.shadow_drain, CARDS_DB.shadow_drain);
  }
  if(mind('kind')) deck.push(CARDS_DB.mind_kind);
  if(mind('just')) deck.push(CARDS_DB.mind_just);
  if(mind('free')) deck.push(CARDS_DB.mind_free);
  if(mind('wis')) deck.push(CARDS_DB.mind_wis);
  if(evilC().length > 0 || S.corr >= 25) deck.push(CARDS_DB.evil_flesh);
  return deck.map((c, idx)=>Object.assign({}, c, { uid: idx + '_' + Math.random() }));
}

function dealDmg(c, raw){
  SFX.hit();
  let dmg = raw;
  if(c.eBlock > 0){ const ab = Math.min(c.eBlock, dmg); c.eBlock -= ab; dmg -= ab; }
  c.eHp = Math.max(0, c.eHp - dmg);
}
function drawCards(c, n){
  for(let i=0;i<n;i++){
    if(c.drawPile.length === 0){
      if(c.discardPile.length === 0) break;
      c.drawPile = c.discardPile.sort(()=>Math.random()-0.5);
      c.discardPile = [];
    }
    if(c.hand.length < 7) c.hand.push(c.drawPile.pop());
  }
}
function enr(c){ return 1 + Math.max(0,(c.turn||1)-3)*0.12; }
function rollEnemyIntent(c){
  const r = Math.random();
  if(c.isEvil && r < 0.28){
    c.intent = { type:'curse', val: Math.round(8 * DIFFICULTIES[S.diff].corrMult), label:`🌀 邪神低語（侵蝕 +${Math.round(8 * DIFFICULTIES[S.diff].corrMult)}，理智 -8）` };
  }else if(r < 0.62){
    const dmg = Math.round(c.atk * enr(c) * R.r(0.85, 1.25));
    c.intent = { type:'attack', val:dmg, label:`⚔️ 猛烈攻擊（預計 ${dmg} 點傷害）` };
  }else if(r < 0.85){
    const blk = Math.round(c.atk * 0.9 * enr(c));
    c.intent = { type:'defend', val:blk, label:`🛡️ 蓄力防禦（獲得 ${blk} 護甲並回血）` };
  }else{
    const dmg = Math.round(c.atk * 1.45 * enr(c));
    c.intent = { type:'heavy', val:dmg, label:`💥 致命重擊（預計 ${dmg} 點巨額傷害）` };
  }
}
function startCombat(cfg){
  const deck = buildPlayerDeck().sort(()=>Math.random()-0.5);
  const maxCogito = 3 + (hasT('star_soul') ? 1 : 0) + (S.wis >= 14 ? 1 : 0);
  const initBlock = (S.equip.relic && S.equip.relic.id === 'amulet_ward') ? 5 : 0;
  const initDraw = 4 + ((S.equip.relic && S.equip.relic.id === 'book_rolls') ? 1 : 0);
  COMBAT = {
    name: cfg.name, eHp: cfg.maxHp, eMaxHp: cfg.maxHp, eBlock: 0, eBurn: 0, eBleed: 0, eWeak: false,
    atk: cfg.atk, isEvil: !!cfg.isEvil, pBlock: initBlock, cogito: maxCogito + (mind('free') ? 2 : 0),
    maxCogito, drawPile: deck, hand: [], discardPile: [],
    logs: [`遭遇強敵「${cfg.name}」！《我思構築》戰術對決開始！`], onWin: cfg.onWin, onLose: cfg.onLose
  };
  drawCards(COMBAT, initDraw); rollEnemyIntent(COMBAT); renderCombat();
}
function playCombatCard(uid){
  if(!COMBAT) return;
  const idx = COMBAT.hand.findIndex(x=>x.uid === uid);
  if(idx === -1) return;
  const card = COMBAT.hand[idx];
  if(COMBAT.cogito < card.cost) return;
  COMBAT.cogito -= card.cost; COMBAT.hand.splice(idx, 1); COMBAT.discardPile.push(card);
  SFX.card();
  COMBAT.logs.unshift(card.play(COMBAT));
  if(COMBAT.eHp <= 0){ endCombat(true); return; }
  renderCombat();
}
function endCombatTurn(){
  if(!COMBAT) return;
  const c = COMBAT;
  if(c.eBurn > 0){ c.eHp = Math.max(0, c.eHp - c.eBurn); c.logs.unshift(`🔥 燃燒灼傷${c.name} ${c.eBurn} 點！`); c.eBurn = Math.max(0, c.eBurn - 1); }
  if(c.eBleed > 0){ c.eHp = Math.max(0, c.eHp - c.eBleed); c.logs.unshift(`🩸 流血使${c.name}損失 ${c.eBleed} 點生命！`); c.eBleed = Math.max(0, c.eBleed - 1); }
  if(c.eHp <= 0){ endCombat(true); return; }

  c.eBlock = 0; const it = c.intent;
  if(it.type === 'attack' || it.type === 'heavy'){
    let dmg = c.eWeak ? Math.round(it.val * 0.75) : it.val; c.eWeak = false;
    const blocked = Math.min(c.pBlock, dmg); c.pBlock -= blocked;
    const realDmg = dmg - blocked;
    if(realDmg > 0){
      S.health -= realDmg; SFX.hit(); flashScreen('rgba(232,86,109,0.45)');
      c.logs.unshift(`${c.name}發動攻擊，護甲抵擋 ${blocked} 點，你受到 ${realDmg} 點傷害！`);
    }else{
      SFX.shield(); c.logs.unshift(`${c.name}的攻擊被護甲（${blocked}）完美格擋！`);
    }
  }else if(it.type === 'defend'){
    c.eBlock += it.val; c.eHp = Math.min(c.eMaxHp, c.eHp + Math.ceil(it.val*0.3));
    c.logs.unshift(`${c.name}架起防禦獲得 ${it.val} 點護甲並恢復生命。`);
  }else if(it.type === 'curse'){
    S.corr = clamp(S.corr + it.val, 0, 100); S.san = clamp(S.san - 8, 0, 100);
    SFX.dread(); flashScreen('rgba(232,86,109,0.55)');
    c.logs.unshift(`${c.name}散發出邪神低語！侵蝕 +${it.val}，理智 -8！`);
  }
  if(S.health <= 0 || S.corr >= 100){ endCombat(false); return; }
  c.pBlock = Math.floor(c.pBlock * 0.3); c.cogito = c.maxCogito;
  while(c.hand.length > 0) c.discardPile.push(c.hand.pop());
  drawCards(c, 4); c.turn=(c.turn||1)+1; rollEnemyIntent(c); renderCombat();
}
function endCombat(win){
  const c = COMBAT; COMBAT = null; $('#combat-modal').hidden = true;
  if(!S.block) newBlock();
  if(win){ SFX.good(); if(c.onWin) c.onWin(); }
  else{ if(c.onLose) c.onLose(); settle(); }
  if(S.alive) runQueue();
  if(!S.alive && !S.pending && !S.ended){ S.ended=true; finalize(); }
  checkLiveAchievements(); autoSave(); render();
}

const hasT = id => S && S.talents.some(t=>t.id===id);
const mind = k => S && S.contracts.some(c=>c.type==='mind'&&c.key===k);
const orbs = () => S ? S.contracts.filter(c=>c.type==='orb') : [];
const evilC = () => S ? S.contracts.filter(c=>c.type==='evil') : [];
const slots = () => S ? S.contracts.filter(c=>c.type!=='mind') : [];
const cap = () => S ? 1 + Math.floor(S.wis/7) : 1;
const regLabel = (s) => {
  if(s.region==='forest'){ if(s.year<25) return '薩茲維茲王國'; return '黑森林帝國'+(s.side?'（'+s.side+'領）':''); }
  return REG[s.region].n;
};
const maxH = () => clamp(S.hpBase - Math.max(0,S.age-45)*1.05 + (S.str-8)*0.6, 25, 115);

function getEquipBonus(){
  const b = {pow:0, sword:0, magic:0, int:0, corrResist:1};
  if(!S || !S.equip) return b;
  for(const slot of ['weapon','relic']){
    const it = S.equip[slot]; if(!it || !it.bonus) continue;
    b.pow += it.bonus.pow || 0; b.sword += it.bonus.sword || 0;
    b.magic += it.bonus.magic || 0; b.int += it.bonus.int || 0;
    if(it.bonus.corrResist) b.corrResist *= it.bonus.corrResist;
  }
  return b;
}

function prepareDraft(){
  const era = draftState.era ? draftState.era.split('-').map(Number) : null;
  const year = era ? R.i(era[0],era[1]) : R.i(0,285);
  const regs = Object.keys(REG).filter(k=>k!=='church'||year>=210).map(k=>({k,w:REG[k].w}));
  const region = pickW(regs).k;
  const g = R.c(.5)?'m':'f', nm = REG[region].nm;
  const name = R.p(nm[g])+'・'+R.p(nm.s);

  const availOrigins = ORIG.filter(o=>(!o.locked || META.unlockedOrigins.includes(o.id)) && (!o.reg||o.reg===region) && (!o.when||o.when(year)));
  let o = availOrigins.find(x=>x.id===draftState.pickedOrigin) || pickW(availOrigins);

  const base = {
    name, g, birth:year, year, age:0, region, side:region==='forest'?R.p(['萊克斯汀','薩森']):null,
    origin:o.id, originN:o.n, hpBase:100, health:100, san:100,
    str:R.i(4,9), int:R.i(4,9), cha:R.i(4,9), luck:R.i(3,10), wis:R.i(3,7),
    kind:R.i(30,70), just:R.i(30,70), free:R.i(30,70),
    money:R.i(o.money[0],o.money[1]), fame:0, corr:0, magic:0, sword:o.sword||0, aff:o.aff||0,
    omen:R.p(['產婆說，你出生的那個夜晚，窗外的星光特別亮。','你落地時沒有哭，只是睜著眼睛，像在看一個很遠的地方。','母親說，懷你的時候，她總夢見漂浮的光點。','你出生那天，遠方傳來悠長的鐘聲，沒人知道是從哪裡來的。','接生的人說，你的手握得很緊，像是抓著什麼東西。'])
  };
  if(o.mod) for(const k in o.mod) base[k] += o.mod[k];
  if(o.v) for(const k in o.v) base[k] = clamp(base[k]+o.v[k],0,100);

  draftState.base = base; draftState.customName = name;
  draftState.alloc = {str:0,int:0,cha:0,luck:0,wis:0}; draftState.pickedOrigin = o.id;
  draftState.pickedTalents = [R.p(TAL.filter(t=>!t.locked)).id];
}

function finalizeCharacterFromDraft(){
  const b = draftState.base;
  const L = Object.assign({}, b, {
    diff: draftState.diff, name: (draftState.customName || b.name).trim() || b.name,
    stage:0, talents:[], contracts:[], lic:{mage:0,sword:0}, job:null,
    awakened:false, awakenAge:null, spouse:null, kids:0, evil:null, ageless:false,
    freed:false, study:0, service:0, done:{}, flags:{}, queue:[], pending:null,
    log:[], block:null, alive:true, ended:false, cause:'', imprint:null, form:null, sage:false, started:true,
    ap:2, maxAp:2, mazeSteps:0, maze:null, debtYears:0,
    estates:[], inventory:[], equip:{weapon:null, relic:null}, relations:[], hadHighCorr:false
  });

  for(const k of ['str','int','cha','luck','wis']) L[k] += (draftState.alloc[k] || 0);
  for(const tid of draftState.pickedTalents){
    const t = TAL.find(x=>x.id===tid); if(!t) continue;
    L.talents.push(t);
    if(t.mod) for(const k in t.mod) L[k] += t.mod[k];
    if(t.v) for(const k in t.v) L[k] = clamp(L[k]+t.v[k],0,100);
    if(t.aff) L.aff += t.aff; if(t.sword) L.sword += t.sword; if(t.hp) L.hpBase += t.hp; if(t.money) L.money += t.money;
  }
  for(const k of ['str','int','cha','luck','wis']) L[k] = clamp(L[k],1,35);
  L.health = L.hpBase;

  const p = clamp(0.10 + L.aff/400 + (L.int>=11?0.03:0) + (L.talents.some(t=>t.id==='star_soul')?0.15:0) + R.r(-0.05,0.07), 0.04, 0.5);
  L.awakenAge = R.c(p) ? (R.c(.25)?R.i(24,50):R.i(9,23)) : null;
  L.relations.push({ id:'parents', n:'雙親與家族', role:'血親', aff:65, alive:true, d:'撫養你長大的家人。' });

  if(L.origin === 'keeper'){
    const legacyArt = META.artifactsLegacy.length ? R.p(META.artifactsLegacy) : { n:'無名殘破星盤', d:'家族世代守護的神秘遺物。', pow:4 };
    L.equip.relic = { id:'legacy_art', n:legacyArt.n, type:'relic', price:0, bonus:{pow:legacyArt.pow||4, magic:2}, d:legacyArt.d, isArtifact:true };
  }
  unlockCG(REG[L.region].cg);
  return L;
}

const LIM={health:[-999,115],san:[0,100],str:[1,35],int:[1,35],cha:[1,35],luck:[0,35],wis:[1,45],money:[-99999,1e9],fame:[0,100],corr:[0,100],kind:[0,100],just:[0,100],free:[0,100],magic:[0,100],sword:[0,100]};
function apply(k,v,line,cause){
  const b=S[k]; let n=b+v;
  if(k==='health') n=Math.min(maxH(),n);
  n=clamp(n,LIM[k][0],LIM[k][1]); S[k]=n;
  const dv=Math.round(n-b);
  if(k==='health'&&v<0) S.cause=cause||'重傷不治';
  if(k==='corr'&&n>=40) S.hadHighCorr=true;
  if(k==='corr'&&n===0&&S.hadHighCorr) unlockAch('purified');
  if(dv!==0) line.d.push({k,v:dv});
}
function say(t,d,cause,cls){
  const line={t,d:[],c:cls||''};
  if(d) for(const k in d) apply(k,d[k],line,cause);
  S.block.lines.push(line);
  settle();
}
function settle(){
  if(!S.alive) return;
  if(S.health<=0) die(S.cause||'重傷不治');
  else if(S.corr>=100) transform();
}
function newBlock(){ S.block={y:S.year,a:S.age,lines:[]}; S.log.unshift(S.block); }

function transform(){
  const g=S.evil||'flesh', E=EVIL[g];
  S.form=E.form; SFX.dread(); flashScreen('rgba(232,86,109,0.65)'); unlockCG('cg_evil');
  S.block.lines.push({t:E.end,d:[],c:'dread'});
  unlockAch('fallen_end');
  die('墮為'+E.form);
}
function die(cause){
  if(!S.alive) return;
  S.alive=false; S.cause=cause||S.cause||'離世'; S.pending=null; S.queue=[];
  SFX.death();
  S.block.lines.push({t:'你的一生在此落幕：'+S.cause+'。',d:[],c:'fin'});
  if(!S.form && S.lic.mage>=3 && orbs().length>0 && S.age>=30){
    unlockCG('cg_imprint');
    S.pending = imprintAsk(); S.ev={};
  }else{
    S.ended=true; finalize();
  }
}

function titleOf(){
  if(S.form) return S.form;
  if(S.sage) return '十二聖賢';
  if(S.lic.mage===5) return '七彩魔法師';
  if(S.lic.sword===5) return '七彩劍聖';
  if(S.lic.mage>=2) return '協會魔法師';
  if(S.corr>=34) return '墮落的魔法師';
  if(S.lic.sword>=2) return '職業劍士';
  if(S.awakened&&S.contracts.length) return '夢境契約者';
  if(S.fame>=45) return '遠近知名之人';
  return '平凡的人';
}

function finalize(){
  const diffObj = DIFFICULTIES[S.diff || 0];
  const rawScore = S.age*0.95 + S.fame*1.5 + Math.max(0,S.money)/22 + (S.lic.mage+S.lic.sword)*14 + S.contracts.length*5 + (S.sage?65:0) + (S.imprint?45:0) + S.kids*4 + S.estates.length*8 - (S.form?20:0);
  const score = Math.floor(rawScore * diffObj.dustBonus);
  const rank = score>=220?'S':score>=160?'A':score>=105?'B':score>=60?'C':'D';
  const dustEarned = Math.max(3, Math.floor(score / 16));
  S.result = { title:titleOf(), score, rank, dustEarned };

  META.dust += dustEarned;
  META.pastLives.unshift({
    name:S.name, birth:S.birth, death:S.year, age:S.age, title:S.result.title,
    rank, score, region:REG[S.region].n, diff:diffObj.n
  });
  META.pastLives = META.pastLives.slice(0, 20);

  unlockAch('first_life');
  if(META.pastLives.length>=5) unlockAch('lives_5');
  if(S.age>=100) unlockAch('centenarian');
  if(S.money>=500 && S.estates.length>=3) unlockAch('tycoon');
  if(S.flags.hero) unlockAch('hero_war');
  if(S.diff===1 && S.age>=65) unlockAch('hard_win');
  if(S.diff===2 && S.age>=60) unlockAch('nightmare_win');
  if(rank==='S') unlockAch('rank_s');

  saveMeta(); auto = false; clearInterval(autoT);
}

function checkLiveAchievements(){
  if(!S) return;
  if(S.awakened) unlockAch('awaken_1');
  if(orbs().length>=1) unlockAch('orb_1');
  if(orbs().length>=3) unlockAch('orb_3');
  if(orbs().some(o=>o.sub)) unlockAch('sub_orb');
  if(S.contracts.some(c=>c.type==='mind')) unlockAch('mind_1');
  if(['kind','just','free','wis'].every(k=>mind(k))) unlockAch('mind_all');
  if(S.sage) unlockAch('sage_12');
  if(S.lic.mage>=3) unlockAch('lic_mage_3');
  if(S.lic.mage===5) unlockAch('lic_mage_5');
  if(S.lic.sword===5) unlockAch('lic_sword_5');
  if(S.imprint) unlockAch('imprint_maker');
  if(META.unlockedCGs.length>=8) unlockAch('cg_collector');
  for(const o of orbs()) if(!META.codexOrbs.includes(o.key)) META.codexOrbs.push(o.key);
  for(const e of evilC()) if(!META.codexOrbs.includes('evil_'+e.key)) META.codexOrbs.push('evil_'+e.key);
  saveMeta();
}

function ageMort(a){
  if(a<5)return .008; if(a<15)return .002;
  if(a<45)return .002+(a-15)*.0001;
  if(a<60)return .006+(a-45)*.0007;
  return .016*Math.pow(1.105,a-60);
}
const EXPO={rors:1,forest:1.25,vet:1.2,tas:.6,church:1};
function warLv(y){if(y<101||y>200)return 0;if(y<120)return 1;if(y<124)return 2;if(y<140)return 3;if(y<160)return 2.5;if(y<180)return 2;return 1.2}
function wars(){
  const y=S.year,r=S.region,o=[];
  if(y>=24&&y<=26)o.push({id:'uni',n:'魔法學園之戰',lv:r==='rors'?1.5:.6,type:'human',end:26});
  if(y>=46&&y<=60&&(r==='tas'||r==='rors'||r==='church'))o.push({id:'tas',n:'塔薩蘇拉入侵戰爭',lv:r==='tas'?1.3:1.6,type:'human',end:60});
  if(y>=54&&y<=68&&r==='forest')o.push({id:'legit',n:'法統戰爭',lv:2,type:'human',end:68});
  const w=warLv(y);if(w>0)o.push({id:'beyond',n:'第三次彼岸魔戰爭',lv:w*EXPO[r],type:'monster',end:200});
  return o.sort((a,b)=>b.lv-a.lv);
}

function baseYear(){
  const a=S.age, mh=maxH(), eq=getEquipBonus(), diff=DIFFICULTIES[S.diff || 0];
  if(S.health<mh) S.health=Math.min(mh,S.health+6+(mind('kind')?5:0)+(S.ageless?4:0));
  else if(S.health>mh) S.health=mh;

  let estateInc = 0;
  for(const est of S.estates){
    if(est.damaged) continue;
    const db = ESTATES_DB[est.id];
    estateInc += db.inc || 0;
    if(db.magic) S.magic = clamp(S.magic + db.magic, 0, 100);
    if(db.san) S.san = clamp(S.san + db.san, 0, 100);
    if(db.fame) S.fame = clamp(S.fame + db.fame, 0, 100);
    if(db.kind) S.kind = clamp(S.kind + db.kind, 0, 100);
    if(db.corr) S.corr = clamp(S.corr + db.corr, 0, 100);
    if(db.mat && R.c(0.25) && S.inventory.filter(x=>x.id==='whetstone').length<2){
      S.inventory.push(Object.assign({}, ITEMS_DB.whetstone));
      say(`【產業產出】你的${db.n}鍛造出了一塊「秘銀強化石」！`, {});
    }
    if(wars().length > 0 && R.c(0.14)){
      est.damaged = true;
      say(`【產業受損】戰火波及了你的「${db.n}」，需在產業頁面花費銀幣修繕才能恢復運作。`, {}, null, 'dread');
    }
  }

  const j=JOBS[S.job];
  if(a>=14){
    const inc = (j?(typeof j.inc==='function'?j.inc():j.inc):0) + estateInc;
    const living = Math.round((4 + S.kids*2.5 + (S.spouse&&S.spouse.alive?2.5:0)) * diff.livingMult);
    S.money += (inc - living);
    if(S.money < 0){
      const interest = Math.ceil(Math.abs(S.money) * 0.15);
      S.money -= interest; S.debtYears++; S.san = clamp(S.san - 6, 0, 100);
      say(`【負債警告】你入不敷出，高利貸滾出了 ${interest} 銀幣利息（累計負債 ${S.debtYears} 年，理智 -6）。`, {}, null, 'dread');
      if(S.debtYears >= 3){
        S.debtYears = 0; S.money = 0; S.job = 'slave'; S.freed = false;
        say('【債務奴役】你無力償還積欠三年的巨額債務，債主將你押入奴隸市場變賣為奴！', {free:-15, fame:-15}, null, 'dread');
      }
    }else S.debtYears = 0;
  }

  const sanLoss = diff.sanDrain + (S.evil ? 2 : 0) - (hasT('will') ? 2 : 0);
  if(sanLoss > 0) S.san = clamp(S.san - sanLoss, 0, 100);
  if(S.san <= 25 && S.alive){
    SFX.dread();
    say('【理智瀕危】耳邊的低語與幻覺令你幾近崩潰，邪神趁虛而入！', {corr: 8 * diff.corrMult, health:-5}, '理智崩潰而亡', 'dread');
  }

  if(j&&j.gain) for(const k in j.gain) S[k]=clamp(S[k]+j.gain[k]*R.r(.5,1.5),1,k==='kind'?100:35);
  if(S.awakened&&S.contracts.length){
    const mult=((j&&j.mg)||.6) + (eq.magic*0.15);
    S.magic=clamp(S.magic+(.9+S.int*.06+S.wis*.05)*mult*R.r(.6,1.4)*(1-S.magic/125),0,100);
  }
  const sw=((j&&j.sw)||(S.sword>0?.15:0)) + (eq.sword*0.2);
  if(sw) S.sword=clamp(S.sword+sw*(.5+S.str/14)*R.r(.6,1.4)*(1-S.sword/125),0,100);

  if(a>52) S.str=Math.max(1,S.str-.22);
  if(a>72) S.int=Math.max(1,S.int-.14);
  if(S.job==='student'){ S.study--; if(S.study<=0) graduate(); }
  if(S.job==='soldier'&&S.service>0){ S.service--; if(S.service<=0) discharge(); }

  if(S.evil){
    let g = R.r(1.2, 3.2) * eq.corrResist * diff.corrMult;
    if(hasT('will')) g*=.5;
    if(hasT('pure_heart')) g*=.5;
    if(mind('kind')) g*=.8;
    S.corr=clamp(S.corr+g,0,100);
  }
  const st=S.corr>=67?2:S.corr>=34?1:0;
  if(st>S.stage&&S.corr<100){
    S.stage=st; const E=EVIL[S.evil||'flesh'];
    SFX.dread(); flashScreen('rgba(232,86,109,0.45)');
    say(st===1?E.s1:E.s2,null,null,'dread');
  }else if(st<S.stage) S.stage=st;

  if(S.spouse&&S.spouse.alive&&R.c(ageMort(a+R.i(0,4))*.75)){
    S.spouse.alive=false;
    const rel = S.relations.find(r=>r.id==='spouse'); if(rel) rel.alive=false;
    say(`${S.spouse.n}離開了人世。`,{health:-6, san:-10},'傷心過度');
    if(S.contracts.some(c=>c.type==='fallen')) S.flags.revive=true;
  }
  if(!S.alive) return;

  let m=ageMort(a)*clamp(1.5-S.health/100,.5,1.5)*(S.awakened?.85:1)*(mind('kind')?.8:1)*(S.ageless?.3:1)*(1-S.luck*.01);
  if(R.c(m)) die(a<5?'年幼夭折':a<45?'急病離世':a<60?'積勞成疾，病逝':'壽終正寢');
}

function graduate(){
  if(S.awakened&&slots().length&&S.lic.mage<1&&R.c(.6)){ S.lic.mage=1; S.job='mage'; say('四年的學業結束了。魔法大學頒給你畢業證書，協會同時授予你銅執照。',{fame:4}); }
  else if(S.awakened&&S.lic.mage>=1){ S.job='mage'; say('你從魔法大學畢業，進入協會任職。',{fame:4}); }
  else{ S.job='scholar'; say(S.awakened?'畢業考試的成績不夠理想，協會沒有發給你執照，你留在學院做研究。':'你從魔法大學畢業，留在學院做研究。',{int:1,fame:3}); }
}
function discharge(){ S.job='vet'; say('服役期滿，你領了退役金，解下戎裝。',{money:R.i(15,35),fame:3}); }

/* ==================== 11. 年度自主行動與操作 ==================== */
function doApAction(type){
  if(!S || !S.alive || S.pending || S.ap <= 0) return;
  S.ap--; SFX.click();
  if(!S.block) newBlock();

  if(type === 'train'){
    S.block.lines.push({t:'【年度行動】你花費大量時間鍛鍊體魄與劍術。', d:[], c:'act'});
    say('揮汗如雨的訓練讓你的筋骨更加強健。', {str:1, sword:R.i(2,5), health:-2});
  }else if(type === 'study'){
    S.block.lines.push({t:'【年度行動】你點亮油燈，埋首研讀典籍與《魔法原理》。', d:[], c:'act'});
    const d = {int:1, wis:R.c(0.45)?1:0};
    if(S.awakened) d.magic = R.i(2,5);
    say('書頁間的知識化為你靈魂的養分。', d);
  }else if(type === 'dream'){
    S.block.lines.push({t:'【年度行動】你調整呼吸，主動沉入夢境彼岸。', d:[], c:'act'});
    if(!S.awakened){
      if(R.c(clamp(0.10 + S.aff/500 + S.wis*0.012,0.04,0.35))){
        S.awakened = true; S.magic = 2; S.mazeSteps = 4; initMaze();
        SFX.orb(); flashScreen('rgba(123,227,192,0.5)'); unlockCG('cg_orbs');
        say('你推開了夢境的大門，成功覺醒！右側「夢境彼岸」迷宮已開啟！', {wis:2, magic:2});
      }else{
        say('夢境依舊是一片濃霧，但你感覺離彼岸更近了一步。', {wis:1}); S.aff += 6;
      }
    }else{
      S.mazeSteps += 3; activeTab = 'maze';
      toast('夢境彼岸開啟', '獲得 3 點探索步數，點擊相鄰格子探索迷霧！');
      say('你將意識投入夢境彼岸迷宮（步數 +3）。', {magic:2});
    }
  }else if(type === 'work'){
    S.block.lines.push({t:'【年度行動】你額外接了許多零工與商務委託，全力賺取銀幣。', d:[], c:'act'});
    const earn = R.i(14, 28) + Math.floor(S.cha * 0.9);
    say(`辛勤的奔波為你帶來了 ${earn} 枚銀幣的額外收入。`, {money:earn, san:-2});
  }else if(type === 'rest'){
    S.block.lines.push({t:'【年度行動】你放下所有重擔，前往鄉間溫泉與林間靜養。', d:[], c:'act'});
    say('身心得到了徹底的放鬆。', {health:22, san:16, corr:S.corr>0?-4:0});
  }else if(type === 'quest'){
    S.block.lines.push({t:'【年度行動】你前往鎮上的佈告欄接取了高難度懸賞委託！', d:[], c:'act'});
    const mult = DIFFICULTIES[S.diff].enemyMult;
    startCombat({
      name: R.p(['荒野巨狼王','墮落流浪法師','墓穴骸骨領主','黑森林盜匪首領']),
      maxHp: Math.round((45 + S.age*0.7) * mult), atk: Math.round((8 + S.age*0.14) * mult), isEvil: R.c(0.4),
      onWin(){ say('你在戰術對決中擊敗懸賞目標，領取了豐厚賞金！', {money:R.i(28,55), fame:5, sword:2}); },
      onLose(){ say('你在懸賞任務中重傷敗逃。', {health:-25, san:-10}, '死於懸賞任務'); }

function advance(){
  if(!S||!S.alive||S.pending||COMBAT||PUZZLE) return;
  SFX.turn();
  S.age++; S.year++; S.ap = S.maxAp;
  if(S.awakened){ S.mazeSteps = 4 + (hasT('dream')?2:0); if(!S.maze) initMaze(); }
  newBlock();
  const nw=NEWS[S.year]; if(nw) S.block.lines.push({t:'【世界記事】'+nw,d:[],c:'news'});
  baseYear();
  if(S.alive){ S.queue=yearEvents(); runQueue(); }
  checkLiveAchievements(); autoSave(); render();
}

function runQueue(){
  while(S.alive && !S.pending && !COMBAT && !PUZZLE && S.queue.length){
    const ev=S.queue.shift();
    if(ev.ask){ const a=ev.ask(); if(!a) continue; if(a.cg) unlockCG(a.cg); S.pending=a; S.ev=ev; return; }
    ev.run();
  }
  if(S.alive && !S.pending && !COMBAT && !PUZZLE && !S.block.lines.some(l=>l.c!=='news' && l.c!=='act')) say(quiet());
}

function choose(i){
  const p=S.pending; if(!p) return;
  const vis=p.choices.filter(c=>!c.ok||c.ok());
  const c=vis[i]; if(!c) return;
  SFX.click(); S.pending=null;
  S.block.lines.push({t:'▸ '+c.t,d:[],c:'pick'});
  c.run();
  if(S.alive && !COMBAT && !PUZZLE) runQueue();
  if(!S.alive && !S.pending && !S.ended){ S.ended=true; finalize(); }
  checkLiveAchievements(); autoSave(); render();
}
const follow=ev=>S.queue.unshift(ev);

function yearEvents(){
  const q=[],a=S.age;
  if(S.awakenAge!=null&&!S.awakened&&a>=S.awakenAge) q.push(EV.awaken);
  if(!S.job&&a>=16&&a<=45) q.push(EV.career);
  if(S.flags.revive){ S.flags.revive=false; q.push(EV.revive); }
  if(S.year===215&&S.origin==='slave'&&!S.freed) q.push(EV.liberate);
  if(S.year===215&&a>=18&&a<=50&&(S.region==='church'||S.region==='forest')) q.push(EV.crusade);
  if(S.year===125&&S.region==='forest'&&S.side==='薩森'&&a>=3) q.push(EV.exile);
  if(a>=14&&S.awakened&&slots().length&&S.lic.mage===0&&R.c(.38)) q.push(EV.examMage);
  else if(S.lic.mage>=1&&S.lic.mage<5&&S.magic>=THR[S.lic.mage]&&(S.lic.mage<4||S.contracts.length>=3)&&R.c(.3)) q.push(EV.examMage);
  if(a>=14&&S.lic.sword<5&&S.sword>=(S.lic.sword===0?10:THR[S.lic.sword])&&R.c(.45)) q.push(EV.examSword);
  for(const e of Object.values(EV)) if(e.hist===S.year&&(!e.when||e.when())) q.push(e);
  const ws=wars();
  if(ws.length){
    const w=ws[0]; S.w=w;
    if(S.job==='soldier'&&S.service>0){ if(R.c(.65)) q.push(EV.battle); }
    else if(a>=16&&a<=45&&!S.done['draft'+w.id]&&R.c(.16*w.lv)){ S.done['draft'+w.id]=1; q.push(EV.draft); }
    else if(a>=5&&R.c(.075*w.lv)) q.push(EV.raid);
  }
  const have=q.length;
  const wf=e=>typeof e.w==='function'?e.w():e.w;
  const pool=Object.values(EV).filter(e=>e.w&&a>=e.age[0]&&a<=e.age[1]&&(!e.once||!S.done[e.id])&&(!e.when||e.when())&&wf(e)>0);
  const trigChance = S.diff === 2 ? 0.97 : (S.diff===1 ? 0.93 : 0.88);
  let n=have===0?(R.c(trigChance)?(R.c(.35)?2:1):0):(R.c(.30)?1:0);
  for(let i=0;i<n&&pool.length;i++){
    const e=pickW(pool,wf); pool.splice(pool.indexOf(e),1);
    if(e.once) S.done[e.id]=1;
    q.push(e);
  }
  return q;
}

function dreamTry(b){
  const eq = getEquipBonus();
  const p=clamp(.14+b+S.luck*.008+S.aff/420+(S.job==='student'?.12:0)+(eq.int*0.03),.06,.88);
  if(R.c(p)) offerOrb();
  else{
    say(R.p(['夢境一片混沌，沒有任何光球回應你。','夢裡的光點離你很遠，你怎麼追也追不上。']));
    if(R.c(.1)) follow(EV.evilDream);
  }
}
function offerOrb(){
  const pool=ORBS.slice(),opts=[];
  for(let i=0;i<(R.c(.45)?2:1);i++){
    const o=pool.splice(R.i(0,pool.length-1),1)[0];
    const sub=R.c(.28)?R.p(o.sub):null; opts.push({o,sub});
  }
  const fallen=(S.corr>0||R.c(.14));
  follow({ask(){
    const ch=opts.map(x=>({t:`與「${x.sub?x.o.n+'・'+x.sub:x.o.n}」夢境光球簽約`,sub:x.o.d,run(){signOrb(x.o,x.sub)}}));
    if(fallen) ch.push({t:'伸手觸碰那顆黯淡龜裂的光球',sub:'墮落光球：侵蝕 +10，獲得黑暗力量',bad:true,run(){signFallen()}});
    ch.push({t:'不簽約，繼續等待',run(){say('你讓光點從指尖飄走。')}});
    return{title:'夢境光球',cg:'cg_orbs',text:'黑暗中，元素光點朝你聚攏，戰術牌組將隨你的選擇而進化！',choices:ch};
  }});
}
function signOrb(o,sub){
  S.contracts.push({type:'orb',key:o.k,n:o.n,sub,label:sub?o.n+'・'+sub:o.n});
  SFX.orb(); flashScreen('rgba(242,214,139,0.5)'); unlockCG('cg_orbs');
  say(`你與「${sub?o.n+'・'+sub:o.n}」夢境光球簽下了契約！戰術牌組已加入對應元素卡牌。`,{magic:6,wis:1});
}
function signFallen(){
  S.contracts.push({type:'fallen',key:'fallen',label:'墮落光球'});
  SFX.dread(); flashScreen('rgba(232,86,109,0.45)'); unlockCG('cg_evil');
  say('光球的裂縫中滲出冰冷的氣息。你簽下了墮落契約。',{magic:10,corr:10,san:-8},null,'dread');
  if(!S.evil) S.evil='flesh';
}

const weakGod={glut:'glut',timid:'fear',devout:'blind'};
function pickGod(){
  const ws={flesh:1,fear:1,glut:1,blind:1};
  for(const t of S.talents) if(weakGod[t.id]) ws[weakGod[t.id]]+=3;
  if(S.evil) ws[S.evil]+=2;
  return pickW(Object.keys(ws).map(k=>({k,w:ws[k]}))).k;
}

function getSlots(){ try{ return JSON.parse(localStorage.getItem(SAVE_SLOTS_KEY) || '[null,null,null,null,null]'); }catch(e){ return [null,null,null,null,null]; } }
function saveToSlot(idx){
  if(!S) return;
  const slots = getSlots();
  slots[idx] = { savedAt: new Date().toLocaleString('zh-TW'), name: S.name, age: S.age, year: S.year, region: regLabel(S), data: JSON.stringify(S) };
  localStorage.setItem(SAVE_SLOTS_KEY, JSON.stringify(slots));
  SFX.good(); toast('存檔成功', `已保存至存檔槽 ${idx+1}`); savesModal();
}
function loadFromSlot(idx){
  const slots = getSlots(); if(!slots[idx]) return;
  try{
    S = JSON.parse(slots[idx].data); SFX.orb();
    $('#modal').hidden = true; $('#home-screen').hidden = true; $('#start').hidden = true; $('#tl').hidden = false; $('#game').hidden = false;
    render(); toast('讀取存檔', `歡迎回來，${S.name}`);

}
function autoSave(){
  if(!S || !S.started) return;
  try{ localStorage.setItem(AUTO_SAVE_KEY, JSON.stringify({ savedAt: new Date().toLocaleString('zh-TW'), name: S.name, age: S.age, year: S.year, region: regLabel(S), data: JSON.stringify(S) })); }catch(e){}
}
function loadAutoSave(){

    const raw = JSON.parse(localStorage.getItem(AUTO_SAVE_KEY) || 'null'); if(!raw) return false;

function renderTL(life){

  for(const m of MARKS) h+=`<div class="tl-mark" title="${m[1]}（中央曆${m[0]}年）" style="left:${pct(m[0])}%"></div>`;
  for(let y=0;y<=300;y+=50) h+=`<div class="tl-tick" style="left:${pct(y)}%">${y}</div>`;
  if(life){
    const e=life.year;
    h+=`<div class="tl-life" style="left:${pct(life.birth)}%;width:${Math.max(.4,pct(e)-pct(life.birth))}%"></div><div class="tl-dot" style="left:${pct(e)}%"></div>`;

}

  if(activeTab === 'log'){
    box.innerHTML = `<div class="log">${S.log.map((b,i)=>`<div class="year ${i===0?'cur':''}"><div class="yh"><span>中央曆 ${b.y} 年 · ${b.a} 歲</span><span>${eraOf(b.y)}</span></div>${b.lines.map(l=>`<p class="ln ${l.c}">${esc(l.t)}${chipHtml(l.d)}</p>`).join('')}</div>`).join('')}</div>`;
  }else if(activeTab === 'maze'){
    if(!S.awakened){
      box.innerHTML = `<div class="panel-box" style="text-align:center;padding:32px">
        <h3 style="margin:0;color:var(--gold);font-family:var(--serif)">尚未推開夢境之門</h3>
        <p style="color:var(--mute)">你尚未覺醒魔法資質。可透過年齡成長自然覺醒，或使用年度行動「🌙 潛入夢境」與「夢境引導香」主動叩問彼岸。</p>
      </div>`;
      return;
    }
    if(!S.maze) initMaze();
    const m = S.maze;
    let cellsHtml = '';
    for(let r=0;r<7;r++){
      for(let c=0;c<7;c++){
        const cell = m.grid[r][c];
        const isPlayer = (m.px === c && m.py === r);
        const shadow = m.shadows.find(sh => sh.x === c && sh.y === r);
        const adj = (Math.abs(c - m.px) + Math.abs(r - m.py) === 1) && S.mazeSteps > 0;
        let cls = 'cell';
        if(!cell.vis) cls += ' fog';
        if(isPlayer) cls += ' player';
        else if(shadow && cell.vis) cls += ' shadow';
        if(adj) cls += ' adj';

        let inner = '';
        if(isPlayer) inner = `<span>🧙</span><small>你</small>`;
        else if(cell.vis){

function renderDock(){
  const d=$('#dock'), di=$('#dockin');
  if(!S || !S.started){ d.hidden=true; return; }
  d.hidden=false;
  if(S.ended){
    di.innerHTML=`<span class="st">本世輪迴已落幕，星塵已匯入傳承殿</span>
      <button class="btn" data-act="home">返回主選單</button>
      <button class="btn pri" data-act="new-draft">✦ 開啟下一世</button>`;
  }else if(!S.alive){
    di.innerHTML=`<span class="st">靈魂正在渡過最後的邊界……</span>`;
  }else if(S.pending){
    di.innerHTML=`<span class="st">⚠️ 請在上方做出命運抉擇</span><button class="btn sm" data-act="save-quick">💾 快速存檔</button>`;
  }else{
    di.innerHTML=`<span class="st">中央曆 ${S.year} 年 · ${S.age} 歲 · 剩餘行動點 <b>${S.ap}</b></span>
      <button class="btn sm" data-act="save-quick">💾 存檔</button>
      <button class="btn ${auto?'on':''}" data-act="auto">${auto?'⏸ 暫停':'⏩ 自動推進'}</button>
      <button class="btn pri" data-act="next">下一年 ➔</button>`;
  }
}

function render(){
  saveMeta(); updateVignette(); applyWallpaper();
  if(!S){ renderHome(); return; }
  if(!S.started){
    $('#home-screen').hidden=true; $('#tl').hidden=false; $('#start').hidden=false; $('#game').hidden=true; $('#dock').hidden=true;
    renderTL(draftState.base); renderStart(); return;
  }
  $('#home-screen').hidden=true; $('#start').hidden=true; $('#tl').hidden=false; $('#game').hidden=false;
  renderTL(S); renderSheet(); renderFate(); renderApBar(); renderTabContent(); renderDock();
}

            <span class="tag-pill">${esc(cg.era)}</span>

          <small style="color:var(--mute);font-size:12px">${unlocked?esc(cg.d):'在歷史事件、夢境覺醒或遺跡探索中觸發即可解鎖。'}</small>

          </div>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>`);

  CG_GALLERY.forEach(cg=>{
    const cvs = document.getElementById('thumb-'+cg.id);
    if(!cvs) return;

      drawCG(cvs, cg.id);

}

/* ==================== 15. 全域互動事件監聽 ==================== */
document.addEventListener('click', e=>{
  SFX.boot();
  const el = e.target.closest('[data-act]');
  if(el){
    const act = el.dataset.act;
    if(act === 'home'){ auto=false; clearInterval(autoT); S=null; renderHome(); return; }
    if(act === 'new-draft'){ auto=false; clearInterval(autoT); prepareDraft(); S={started:false}; render(); return; }
    if(act === 'cont-auto'){ loadAutoSave(); return; }
    if(act === 'gallery'){ galleryModal(); return; }
    if(act === 'view-cg'){ viewFullCG(el.dataset.id); return; }
    if(act === 'set-wp'){
      META.wallpaper = el.dataset.id; saveMeta(); applyWallpaper();
      toast('已更換動態桌布', '大廳背景已切換為所選史詩 CG！'); galleryModal(); return;
    }
    if(act === 'dl-cg'){
      const cvs = $('#full-cg-cvs');
      if(cvs){ const a=document.createElement('a'); a.download=`wisen_${el.dataset.id}.png`; a.href=cvs.toDataURL('image/png'); a.click(); }
      return;
    }
    if(act === 'legacy'){ legacyModal(); return; }
    if(act === 'ach'){ achModal(); return; }
    if(act === 'codex'){ codexModal(); return; }
    if(act === 'settings'){
      const on = SFX.toggle();
      $('#btn-audio').textContent = on ? '🔊 音效' : '🔇 靜音';
      toast('音效設定', on ? '已開啟奇幻合成配樂與音效' : '已靜音'); return;
    }
    if(act === 'close'){ $('#modal').hidden=true; return; }

    /* 古殿符文儀球解謎控制 */
    if(act === 'pz-rot'){ rotatePuzzleRing(Number(el.dataset.r), Number(el.dataset.d)); return; }
    if(act === 'pz-abort'){ abortPuzzle(); return; }

    /* 星塵傳承購買 */
    if(act === 'up-pts'){ return; }
    if(false){
      const pts = META.settings.basePts || 3, cost = pts * 40;
      if(pts < 6 && META.dust >= cost){ META.dust -= cost; META.settings.basePts = pts + 1; saveMeta(); SFX.good(); legacyModal(); }
      return;
    }
    if(act === 'unlock-tal'){
      const t = TAL.find(x=>x.id===el.dataset.id);
      if(t && !META.unlockedTalents.includes(t.id) && META.dust >= t.cost){
        META.dust -= t.cost; META.unlockedTalents.push(t.id); saveMeta(); SFX.good(); legacyModal();
      }
      return;
    }
    if(act === 'unlock-orig'){
      const o = ORIG.find(x=>x.id===el.dataset.id);
      if(o && !META.unlockedOrigins.includes(o.id) && META.dust >= o.cost){
        META.dust -= o.cost; META.unlockedOrigins.push(o.id); saveMeta(); SFX.good(); legacyModal();
      }
      return;
    }

    /* 創角界面操作 */
    if(act === 'set-diff'){ draftState.diff = Number(el.dataset.id); SFX.click(); renderStart(); return; }
    if(act === 'reroll'){ return; }
    if(act === 'rand-name'){
      const b = draftState.base, nm = REG[b.region].nm;
      draftState.customName = R.p(nm[b.g])+'・'+R.p(nm.s);
      SFX.click(); renderStart(); return;
    }
    if(act === 'pt-add'){
      const maxPts = 3;
      const used = Object.values(draftState.alloc).reduce((a,c)=>a+c,0);
      if(used < maxPts){ draftState.alloc[el.dataset.k]++; SFX.click(); renderStart(); }
      return;
    }
    if(act === 'pt-sub'){
      if(draftState.alloc[el.dataset.k] > 0){ draftState.alloc[el.dataset.k]--; SFX.click(); renderStart(); }
      return;
    }
    if(act === 'toggle-tal'){
      const tid = el.dataset.id;
      const idx = draftState.pickedTalents.indexOf(tid);
      if(idx >= 0) draftState.pickedTalents.splice(idx, 1);
      else if(draftState.pickedTalents.length < 2) draftState.pickedTalents.push(tid);
      SFX.click(); renderStart(); return;
    }
    if(act === 'begin'){
      S = finalizeCharacterFromDraft();
      newBlock();
      const nw = NEWS[S.year]; if(nw) S.block.lines.push({t:'【世界記事】'+nw,d:[],c:'news'});
      say(`中央曆 ${S.birth} 年，你降生在${regLabel(S)}的一個${S.originN}。${S.omen}`);
      autoSave(); SFX.orb(); render(); return;
    }

    /* 遊戲內操作 */
    if(act === 'next'){ advance(); return; }
    if(act === 'choose'){ choose(Number(el.dataset.i)); return; }
    if(act === 'auto'){ if(auto) stopAuto(); else startAuto(); renderDock(); return; }
    if(act === 'ap'){ doApAction(el.dataset.type); return; }
    if(act === 'maze-step'){ stepMaze(Number(el.dataset.x), Number(el.dataset.y)); return; }
    if(act === 'buy-est'){ buyEstate(el.dataset.id); return; }
    if(act === 'repair-est'){ repairEstate(Number(el.dataset.idx)); return; }
    if(act === 'buy-item'){ buyItem(el.dataset.id); return; }
    if(act === 'use-item'){ useItem(Number(el.dataset.idx)); return; }
    if(act === 'rel-talk'){ interactRel(el.dataset.id, 'talk'); return; }
    if(act === 'rel-gift'){ interactRel(el.dataset.id, 'gift'); return; }

    /* 卡牌戰鬥 */
    if(act === 'play-card'){ playCombatCard(el.dataset.uid); return; }
    if(act === 'combat-end-turn'){ endCombatTurn(); return; }
  }

  const tabEl = e.target.closest('.tab');
  if(tabEl){ activeTab = tabEl.dataset.tab; SFX.click(); renderTabContent(); return; }
  if(e.target.id === 'modal') $('#modal').hidden=true;
});
